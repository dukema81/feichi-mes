            materialCode: document.getElementById("noMat").value,
            qty: Number(document.getElementById("noQty").value),
            line: document.getElementById("noLine").value,
            priority: document.getElementById("noPrio").value,
            planStart: document.getElementById("noStart").value,
            customer: document.getElementById("noCust").value,
            remark: document.getElementById("noRemark").value
          }).then(function (x) {
            F.closeDialog();
            F.toast("已创建 " + x.no + "（" + x.opCount + " 道工序）", "ok");
            F.reload().then(function () { F.go("orders"); location.reload(); });
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
    }).catch(function (e) { F.toast(e.message, "err"); });
  }

  /* ---------------------------------------------------------- 工单详情 */
  function openOrder(no) {
    F.api("GET", "/api/orders/" + encodeURIComponent(no)).then(function (d) {
      var canWrite = F.can("write"), canApprove = F.can("approve"), canRep = F.can("report"),
        canStock = F.can("stock");

      var gates = "";
      Object.keys(d.gate || {}).forEach(function (t) {
        var miss = d.gate[t];
        var ok = !miss.length;
        gates += '<div class="gate ' + (ok ? "ok" : "") + '"><b>' + F.esc(t) + "</b>" +
          (ok ? '<span class="tag green">可推进</span>' :
            '<span class="small muted">' + F.esc(miss.join("；")) + "</span>") + "</div>";
      });

      var ops = '<table class="grid-table"><thead><tr><th>工序</th><th>工位 / 设备</th>' +
        '<th class="num">计划</th><th class="num">合格</th><th class="num">不良</th>' +
        '<th class="num">标准/实际</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
        (d.operations || []).map(function (o) {
          return "<tr><td>" + F.esc(o.seq + " " + o.process) + "</td><td>" + F.esc(o.station) +
            '<div class="muted small mono">' + F.esc(o.equipment || "") + "</div></td>" +
            '<td class="num">' + F.qty(o.planQty) + '</td><td class="num">' + F.qty(o.goodQty) +
            '</td><td class="num">' + F.qty(o.ngQty) + "</td>" +
            '<td class="num small">' + F.hour(o.stdMin) + " / " + F.hour(o.actualMin) + "</td>" +
            "<td>" + F.tag(o.status) + "</td>" +
            '<td>' + (canRep && o.status !== "已完成" && (d.status === "已下达" || d.status === "已开工")
              ? '<button class="btn sm" data-rep="' + o.seq + '">报工</button>' : "") + "</td></tr>";
        }).join("") + "</tbody></table>";

      var mats = '<table class="grid-table"><thead><tr><th>物料</th><th class="num">需求</th>' +
        '<th class="num">已发</th><th class="num">现有库存</th><th class="num">缺口</th><th>状态</th></tr></thead><tbody>' +
        (d.materials || []).map(function (m) {
          return "<tr><td>" + F.esc(m.name) + '<div class="muted small mono">' + F.esc(m.materialCode) +
            "</div></td><td class='num'>" + F.qty(m.need) + '</td><td class="num">' + F.qty(m.issued) +
            "</td><td class='num'>" + F.qty(m.onHand) + "</td><td class='num'>" +
            (m.short > 0 ? '<b class="up">' + F.qty(m.short) + "</b>" : "0") +
            "</td><td>" + F.tag(m.state, m.state === "已齐套" ? "green" : "gold") + "</td></tr>";
        }).join("") + "</tbody></table>";

      var insp = F.table([
        { label: "检验单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
        { label: "类型", render: function (r) { return F.tag(r.type); } },
        { label: "工序", render: function (r) { return F.esc(r.process); } },
        { label: "抽样/不良", num: true, render: function (r) { return F.qty(r.sampleQty) + " / " + F.qty(r.defectQty); } },
        { label: "结论", render: function (r) { return F.tag(r.result); } },
        { label: "检验员", render: function (r) { return F.esc(r.inspectorName); } },
        { label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.inspectedAt) + "</span>"; } }
      ], d.inspections || [], { empty: "尚无检验记录" });

      var body = '<div class="kpi-grid four" style="margin-bottom:10px">' +
        '<div class="kpi"><div class="k-label">计划 / 已报工</div><div class="k-value" style="font-size:19px">' +
        F.qty(d.qty) + " / " + F.qty(d.reportedQty) + '</div><div class="k-sub">合格 ' + F.qty(d.goodQty) +
        " · 不良 " + F.qty(d.ngQty) + "</div></div>" +
        '<div class="kpi"><div class="k-label">进度</div><div class="k-value" style="font-size:19px">' +
        F.pct(Math.min(1, d.progress), 1) + '</div><div class="k-sub">工序 ' + d.opDone + "/" +
        d.opCount + "</div></div>" +
        '<div class="kpi"><div class="k-label">工时达成</div><div class="k-value" style="font-size:19px">' +
        (d.eff ? F.pct(d.eff, 1) : "—") + '</div><div class="k-sub">标准 ' + F.hour(d.stdMin) + "</div></div>" +
        '<div class="kpi"><div class="k-label">状态</div><div class="k-value" style="font-size:19px">' +
        F.tag(d.status) + '</div><div class="k-sub">' + F.esc(d.dueState) + " · 计划完成 " +
        F.esc(d.planEnd) + "</div></div></div>" +
        '<div class="detail-head"><b>' + F.esc(d.materialName) + "</b> <span class=\"mono small\">" +
        F.esc(d.materialCode) + "</span> <span class=\"muted small\">" + F.esc(d.materialSpec || "") +
        "</span></div>" +
        '<div class="small muted" style="margin:6px 0 10px">客户：' + F.esc(d.customer || "—") +
        " · 产线：" + F.esc(d.line) + " · 工艺：" + F.esc(d.routingCode) + " · BOM：" + F.esc(d.bomCode) +
        " · 计划 " + F.esc(d.planStart) + " ~ " + F.esc(d.planEnd) + "</div>" +
        '<div class="gate-box">' + gates + "</div>" +
        '<div class="section-title">工序与报工</div>' + ops +
        '<div class="section-title">用料与齐套（' + F.pct(d.kit.rate, 0) + "）</div>" + mats +
        '<div class="section-title">检验记录</div>' + insp +
        (d.batch ? '<div class="section-title">产出批次</div><div class="small">' +
          '<span class="mono">' + F.esc(d.batch.no) + "</span> · 数量 " + F.qty(d.batch.qty) +
          " · " + F.esc(d.batch.producedAt) +
          ' · <a href="#trace?batch=' + encodeURIComponent(d.batch.no) + '">查看追溯</a></div>' : "");

      var foot = "";
      if (canWrite && (d.status === "草稿" || d.status === "已下达" || d.status === "已开工")) {
        foot += '<button class="btn sm" id="odIssue">发料</button> ';
      }
      (d.nextTargets || []).forEach(function (t) {
        var allow = (t === "已下达" ? canApprove : (t === "已入库" ? canStock : canWrite));
        if (!allow) return;
        var miss = (d.gate && d.gate[t]) || [];
        foot += '<button class="btn sm ' + (t === "已下达" ? "" : "primary") + '" data-stage="' + t + '"' +
          (t === "已入库" && d.status !== "已完工" ? " disabled" : "") + ">" +
          (t === "已下达" ? "下达" : (t === "已开工" ? "开工" : (t === "已完工" ? "完工确认" : t))) +
          (miss.length ? "（缺 " + miss.length + " 项）" : "") + "</button> ";
      });
      if (canWrite && (d.status === "草稿" || d.status === "已下达" || d.status === "已开工")) {
        foot += '<button class="btn sm danger" id="odCancel">取消工单</button>';
      }
      if (d.status === "已完工" && canStock) {
        foot += '<button class="btn sm primary" id="odStock">完工入库</button>';
      }
      if (!foot) foot = '<span class="small muted">当前角色无可用操作</span>';

      F.dialog("工单 " + d.no, body, foot);

      document.querySelectorAll("[data-rep]").forEach(function (b) {
        b.addEventListener("click", function () { reportDialog(d, b.getAttribute("data-rep")); });
      });
      document.querySelectorAll("[data-stage]").forEach(function (b) {
        b.addEventListener("click", function () {
          var t = b.getAttribute("data-stage");
          if (t === "已入库") return stockIn(d.no);
          F.api("POST", "/api/orders/" + d.no + "/stage", { target: t }).then(function () {
            F.closeDialog();
            F.toast("工单已推进到「" + t + "」", "ok");
            F.reload().then(function () { openOrder(d.no); });
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      var iss = document.getElementById("odIssue");
      if (iss) iss.addEventListener("click", function () {
        F.api("POST", "/api/orders/" + d.no + "/issue", {}).then(function (x) {
          F.toast("发料完成：" + x.issued + " 项", "ok");
          F.closeDialog();
          openOrder(d.no);
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
      var cxl = document.getElementById("odCancel");
      if (cxl) cxl.addEventListener("click", function () {
        var r = window.prompt("取消原因（必填）", "客户订单变更");
        if (!r) return;
        F.api("POST", "/api/orders/" + d.no + "/cancel", { reason: r }).then(function () {
          F.closeDialog();
          F.toast("工单已取消", "ok");
          F.reload().then(function () { openOrder(d.no); });
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
      var stk = document.getElementById("odStock");
      if (stk) stk.addEventListener("click", function () { stockIn(d.no); });
      F.setStatus("工单 " + d.no + " · " + d.status + " · 进度 " + F.pct(d.progress, 0));
    }).catch(function (e) { F.toast(e.message, "err"); });
  }

  function stockIn(no) {
    F.api("POST", "/api/orders/" + no + "/stock-in", { warehouse: "成品仓" }).then(function (x) {
      F.closeDialog();
      F.toast("已入库，批次 " + x.batch + "：" + F.qty(x.qty) + " 件", "ok");
      F.reload().then(function () { openOrder(no); });
    }).catch(function (e) { F.toast(e.message, "err"); });
  }

  function reportDialog(d, seq) {
    var op = (d.operations || []).filter(function (o) { return String(o.seq) === String(seq); })[0];
    if (!op) return;
    var left = Math.max(0, Number(op.planQty) - Number(op.goodQty) - Number(op.ngQty));
    F.dialog("报工 · " + op.process,
      '<div class="form-grid">' +
      '<label>工序</label><input value="' + F.esc(op.seq + " " + op.process) + '" disabled>' +
      '<label>设备</label><input value="' + F.esc(op.equipment || "") + '" disabled>' +
      '<label>合格数</label><input id="rpGood" type="number" value="' + left + '" min="0">' +
      '<label>不良数</label><input id="rpNg" type="number" value="0" min="0">' +
      '<label>实际工时</label><input id="rpMin" type="number" value="' +
      (op.stdMin ? Number(op.stdMin).toFixed(1) : 0) + '" min="0">' +
      '<label>备注</label><input id="rpRemark" placeholder="选填">' +
      "</div>" +
      '<div class="small muted" style="margin-top:8px">本工序待报 ' + F.qty(left) +
      " 件；标准工时 " + F.hour(op.stdMin) + "。报工将累计到工单，全部工序完成后自动转「已完工」。</div>",
      '<button class="btn primary" id="rpOk">提交报工</button>');
    document.getElementById("rpOk").addEventListener("click", function () {
      F.api("POST", "/api/orders/" + d.no + "/report", {
        seq: Number(seq),
        goodQty: Number(document.getElementById("rpGood").value || 0),
        ngQty: Number(document.getElementById("rpNg").value || 0),
        actualMin: Number(document.getElementById("rpMin").value || 0),
        remark: document.getElementById("rpRemark").value
      }).then(function (x) {
        F.closeDialog();
        F.toast("报工成功 " + x.reportNo + " · 效率 " + F.pct(x.eff, 1) +
          (x.woStatus === "已完工" ? " · 工单已完工" : ""), "ok");
        F.reload().then(function () { openOrder(d.no); });
      }).catch(function (e) { F.toast(e.message, "err"); });
    });
  }
})(window, document);

</script>
<script>
/* 飞驰 MES · 物料与 BOM、批次追溯 */
(function (window, document) {
  "use strict";
  var F = window.F;
  var TYPES = ["全部", "原材料", "半成品", "成品"];

  /* ---------------------------------------------------------- 物料主数据 */
  var st = { type: "全部", kw: "" };

  F.register("materials", function () {
    document.getElementById("view").innerHTML =
      '<div class="panel"><div class="panel-title">物料与 BOM' +
      '<span class="panel-actions">' +
      '<input id="mKw" placeholder="编码 / 名称 / 规格" style="width:200px;margin-right:6px">' +
      '<button class="btn sm" id="mSearch">查询</button> ' +
      '<button class="btn sm" id="mNew">新建物料</button></span></div>' +
      '<div class="panel-body"><div id="mChips"></div><div id="mSummary"></div>' +
      '<div id="mList">加载中…</div></div></div>';

    function load() {
      F.api("GET", "/api/materials?" + F.qs({ type: st.type === "全部" ? "" : st.type, kw: st.kw }))
        .then(function (d) {
          document.getElementById("mChips").innerHTML = F.chips(TYPES, st.type);
          document.getElementById("mSummary").innerHTML =
            '<div class="kpi-grid four" style="margin-bottom:10px">' +
            '<div class="kpi"><div class="k-label">物料数</div><div class="k-value">' + d.summary.count +
            '</div><div class="k-sub">成品 ' + d.summary.finished + " 项</div></div>" +
            '<div class="kpi red"><div class="k-label">低于安全库存</div><div class="k-value">' +
            d.summary.belowSafety + '</div><div class="k-sub">需补货或调整</div></div>' +
            '<div class="kpi"><div class="k-label">库存金额</div><div class="k-value">' +
            F.wan(d.summary.amount) + '</div><div class="k-sub">按标准成本</div></div>' +
            '<div class="kpi gold"><div class="k-label">成品 / 半成品</div><div class="k-value">' +
            (d.list.filter(function (x) { return x.type === "成品"; }).length) + " / " +
            (d.list.filter(function (x) { return x.type === "半成品"; }).length) +
            '</div><div class="k-sub">可下达工单</div></div></div>';
          document.getElementById("mList").innerHTML = F.table([
            { label: "物料编码", render: function (r) { return '<span class="mono small">' + F.esc(r.code) + "</span>"; } },
            { label: "名称 / 规格", render: function (r) { return F.esc(r.name) +
              '<div class="muted small">' + F.esc(r.spec || "—") + "</div>"; } },
            { label: "类型", render: function (r) { return F.tag(r.type, r.type === "成品" ? "green" :
              (r.type === "半成品" ? "blue" : "gray")); } },
            { label: "ABC", render: function (r) { return F.tag(r.abc); } },
            { label: "现存量", num: true, render: function (r) {
              return '<b class="' + (r.belowSafety ? "up" : "") + '">' + F.qty(r.onHand) + "</b> " +
                F.esc(r.unit); } },
            { label: "安全库存", num: true, render: function (r) { return F.qty(r.safetyStock); } },
            { label: "标准成本", num: true, render: function (r) { return F.num(r.stdCost, 2); } },
            { label: "库存金额", num: true, render: function (r) { return F.wan(r.amount); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } }
          ], d.list, { empty: "没有匹配的物料", click: function (r) { return r.code; } });
          F.bindRows(document, function (code) { detail(code); });
          document.querySelectorAll("#mChips .chip").forEach(function (c) {
            c.addEventListener("click", function () { st.type = c.getAttribute("data-st"); load(); });
          });
          F.setStatus("物料主数据 · " + d.total + " 项");
          F.setSide('<div class="side-block"><div class="hd">物料分类</div><div class="bd">' +
            ["原材料", "半成品", "成品"].map(function (t) {
              var arr = d.list.filter(function (x) { return x.type === t; });
              return F.kv(t, arr.length + " 项 · " + F.wan(arr.reduce(function (a, b) {
                return a + b.amount;
              }, 0)));
            }).join("") + "</div></div>" +
            '<div class="side-block"><div class="hd">齐套口径</div><div class="bd small muted" ' +
            'style="line-height:1.9">工单齐套率 = 已齐套物料项数 ÷ 需求项数；可用量 = 现有库存 + 已发料。' +
            "齐套率 100% 才允许下达（规则可关闭）。</div></div>");
        }).catch(function (e) { F.toast(e.message, "err"); });
    }

    document.getElementById("mSearch").addEventListener("click", function () {
      st.kw = document.getElementById("mKw").value.trim();
      load();
    });
    document.getElementById("mKw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { st.kw = e.target.value.trim(); load(); }
    });
    document.getElementById("mNew").addEventListener("click", function () {
      F.dialog("新建物料",
        '<div class="form-grid">' +
        '<label>物料编码</label><input id="nmCode" placeholder="MT-9100">' +
        '<label>名称</label><input id="nmName" placeholder="物料名称">' +
        '<label>规格</label><input id="nmSpec" placeholder="规格型号">' +
        '<label>单位</label><input id="nmUnit" value="件">' +
        '<label>类型</label><select id="nmType"><option>原材料</option><option>半成品</option>' +
        "<option>成品</option></select>" +
        '<label>安全库存</label><input id="nmSafety" type="number" value="100">' +
        '<label>标准成本</label><input id="nmCost" type="number" value="10">' +
        '<label>采购提前期</label><input id="nmLead" type="number" value="7">' +
        "</div>",
        '<button class="btn" id="nmOk">创建</button>');
      document.getElementById("nmOk").addEventListener("click", function () {
        F.api("POST", "/api/materials", {
          code: document.getElementById("nmCode").value.trim(),
          name: document.getElementById("nmName").value.trim(),
          spec: document.getElementById("nmSpec").value,
          unit: document.getElementById("nmUnit").value,
          type: document.getElementById("nmType").value,
          safetyStock: Number(document.getElementById("nmSafety").value || 0),
          stdCost: Number(document.getElementById("nmCost").value || 0),
          leadDays: Number(document.getElementById("nmLead").value || 7)
        }).then(function () {
          F.closeDialog();
          F.toast("物料已创建", "ok");
          load();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    });
    load();
  });

  function detail(code) {
    F.api("GET", "/api/materials/" + encodeURIComponent(code)).then(function (d) {
      var m = d.material;
      var bom = d.bom ? '<table class="grid-table"><thead><tr><th>序号</th><th>组件</th>' +
        '<th class="num">用量</th><th class="num">损耗率</th><th class="num">现有库存</th>' +
        '</tr></thead><tbody>' + d.bom.items.map(function (x) {
          return "<tr><td>" + x.component + "</td><td>" + F.esc(x.name) + "</td>" +
            "<td class='num'>" + F.qty(x.qty) + "</td><td class='num'>" + F.pct(x.lossRate, 1) +
            "</td><td class='num'>" + F.qty(x.onHand) + "</td></tr>";
        }).join("") + "</tbody></table>" : '<div class="muted small">该物料没有 BOM</div>';

      var routing = d.routing ? '<table class="grid-table"><thead><tr><th>工序</th><th>工位</th>' +
        '<th>设备类型</th><th class="num">标准工时</th><th class="num">节拍(秒)</th><th>关键</th>' +
        '</tr></thead><tbody>' + d.routing.steps.map(function (s) {
          return "<tr><td>" + s.seq + " " + F.esc(s.process) + "</td><td>" + F.esc(s.station) +
            "</td><td>" + F.esc(s.equipType) + "</td><td class='num'>" + F.num(s.stdMin, 2) +
            "</td><td class='num'>" + F.num(s.cycleSec, 0) + "</td><td>" +
            (s.isKey ? F.tag("关键", "gold") : "—") + "</td></tr>";
        }).join("") + "</tbody></table>" : '<div class="muted small">该物料没有工艺路线</div>';

      var stock = F.table([
        { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.batch) + "</span>"; } },
        { label: "仓库", key: "warehouse" },
        { label: "数量", num: true, render: function (r) { return F.qty(r.qty) + " " + F.esc(m.unit); } },
        { label: "更新时间", render: function (r) { return '<span class="small muted">' + F.esc(r.updatedAt) + "</span>"; } }
      ], d.stock, { empty: "暂无库存" });

      var orders = F.table([
        { label: "工单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
        { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
        { label: "计划完成", key: "planEnd" },
        { label: "状态", render: function (r) { return F.tag(r.status); } }
      ], d.orders, { empty: "暂无工单" });

      var batches = F.table([
        { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
        { label: "工单", render: function (r) { return F.esc(r.woNo || "—"); } },
        { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
        { label: "产出时间", render: function (r) { return '<span class="small">' + F.esc(r.producedAt) + "</span>"; } },
        { label: "状态", render: function (r) { return F.tag(r.status); } }
      ], d.batches, { empty: "暂无批次" });

      F.dialog("物料 " + m.code,
        '<div class="detail-head"><b>' + F.esc(m.name) + '</b><span class="muted small">' +
        F.esc(m.spec || "") + '</span><span class="spacer"></span>' + F.tag(m.type, "blue") +
        F.tag(m.abc) + "</div>" +
        '<div class="kpi-grid four" style="margin:10px 0">' +
        '<div class="kpi"><div class="k-label">现存量</div><div class="k-value" style="font-size:18px">' +
        F.qty(m.onHand) + " " + F.esc(m.unit) + '</div><div class="k-sub">安全 ' +
        F.qty(m.safetyStock) + "</div></div>" +
        '<div class="kpi"><div class="k-label">库存金额</div><div class="k-value" style="font-size:18px">' +
        F.wan(m.amount) + '</div><div class="k-sub">标准成本 ' + F.num(m.stdCost, 2) + "</div></div>" +
        '<div class="kpi"><div class="k-label">提前期</div><div class="k-value" style="font-size:18px">' +
        m.leadDays + ' 天</div><div class="k-sub">分类 ' + F.esc(m.category || "—") + "</div></div>" +
        '<div class="kpi"><div class="k-label">BOM / 工序</div><div class="k-value" style="font-size:18px">' +
        (d.bom ? d.bom.items.length : 0) + " / " + (d.routing ? d.routing.steps.length : 0) +
        '</div><div class="k-sub">' + (d.routing ? "平衡率 " + F.pct(d.routing.steps.length ?
          0 : 0, 0) : "") + "</div></div></div>" +
        '<div class="section-title">BOM 结构' + (d.bom ? '（' + F.esc(d.bom.code) + " " +
          F.esc(d.bom.version) + "）" : "") + "</div>" + bom +
        '<div class="section-title">工艺路线' + (d.routing ? '（' + F.esc(d.routing.code) + " " +
          F.esc(d.routing.version) + "）" : "") + "</div>" + routing +
        '<div class="section-title">库存批次</div>' + stock +
        '<div class="section-title">近期工单</div>' + orders +
        '<div class="section-title">产出批次</div>' + batches,
        '<span class="small muted">库存数量随发料、入库实时变化</span>');
    }).catch(function (e) { F.toast(e.message, "err"); });
  }

  /* ---------------------------------------------------------- 批次追溯 */
  F.register("trace", function (params) {
    var view = document.getElementById("view");
    view.innerHTML = '<div class="panel"><div class="panel-title">批次追溯' +
      '<span class="panel-actions">' +
      '<input id="trBatch" placeholder="输入批次号，如 B20261018-01" style="width:240px;margin-right:6px">' +
      '<button class="btn sm" id="trGo">追溯</button></span></div>' +
      '<div class="panel-body"><div id="trResult" class="muted small">' +
      "输入批次号或从下方列表选择，正向展开成品→组件→原料，反向定位该批次流向。</div></div></div>" +
      '<div class="panel"><div class="panel-title">最近批次' +
      '<span class="panel-actions small muted">近 200 条</span></div>' +
      '<div class="panel-body flush" id="trList">加载中…</div></div>';

    function loadList() {
      F.api("GET", "/api/batches").then(function (d) {
        document.getElementById("trList").innerHTML = F.table([
          { label: "批次号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
          { label: "物料", render: function (r) { return F.esc(r.materialName) +
            '<div class="muted small mono">' + F.esc(r.materialCode) + "</div>"; } },
          { label: "工单", render: function (r) { return F.esc(r.woNo || "—"); } },
          { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
          { label: "下级批次", num: true, render: function (r) { return r.children; } },
          { label: "产出时间", render: function (r) { return '<span class="small">' + F.esc(r.producedAt) + "</span>"; } },
          { label: "状态", render: function (r) { return F.tag(r.state, r.state === "正常" ? "green" :
            (r.state === "临期" ? "gold" : "red")); } }
        ], d.list, { empty: "暂无批次", click: function (r) { return r.no; } });
        F.bindRows(document, function (no) { show(no); });
        F.setStatus("批次追溯 · " + d.total + " 个批次");
        if (d.expiring) F.toast("有 " + d.expiring + " 个批次临期或已过期", "err");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function show(no) {
      if (!no) return;
      F.api("GET", "/api/trace?batch=" + encodeURIComponent(no)).then(function (d) {
        F.api("GET", "/api/batches/" + encodeURIComponent(no)).then(function (b) {
          var levels = {};
          d.nodes.forEach(function (n) {
            (levels[n.depth] = levels[n.depth] || []).push(n);
          });
          var tree = Object.keys(levels).sort().map(function (lv) {
            return '<div class="trace-level"><div class="tl-label">' +
              (Number(lv) === 0 ? "成品批次" : (Number(lv) === 1 ? "直接组件" : "第 " + lv + " 层物料")) +
              '</div><div class="tl-items">' + levels[lv].map(function (n) {
                return '<div class="tl-node"><span class="mono small">' + F.esc(n.batch) + "</span>" +
                  '<div class="small">' + F.esc(n.materialName) + "</div>" +
                  '<div class="muted small">' + F.qty(n.qty) + " · " + F.esc(n.producedAt.slice(0, 10)) +
                  "</div></div>";
              }).join("") + "</div></div>";
          }).join('<div class="trace-arrow">↓</div>');

          var html = '<div class="kpi-grid four" style="margin-bottom:10px">' +
            '<div class="kpi"><div class="k-label">批次</div><div class="k-value" style="font-size:15px">' +
            F.esc(d.root) + '</div><div class="k-sub">' + F.esc(b.materialName) + "</div></div>" +
            '<div class="kpi"><div class="k-label">来源工单</div><div class="k-value" style="font-size:15px">' +
            F.esc(b.woNo || "—") + '</div><div class="k-sub">' + F.esc(b.order ? b.order.status : "") +
            "</div></div>" +
            '<div class="kpi"><div class="k-label">数量</div><div class="k-value" style="font-size:15px">' +
            F.qty(b.qty) + ' <span class="small">' + F.esc(b.unit || "") + "</span></div>" +
            '<div class="k-sub">产出 ' + F.esc(b.producedAt) + "</div></div>" +
            '<div class="kpi"><div class="k-label">追溯节点</div><div class="k-value" style="font-size:15px">' +
            d.nodeCount + '</div><div class="k-sub">上游 ' + d.upstream.length + " 层</div></div></div>";

          html += '<div class="section-title">正向展开（成品 → 组件 → 原料）</div>' +
            '<div class="trace-tree">' + tree + "</div>";
          if (d.upstream.length) {
            html += '<div class="section-title">反向流向（该批次被用于）</div><div class="small">' +
              d.upstream.map(function (u) { return '<span class="tag blue">' + F.esc(u) + "</span>"; }).join(" ") +
              "</div>";
          }
          html += '<div class="section-title">报工记录（来源工单）</div>' + F.table([
            { label: "报工单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "工序", key: "process" },
            { label: "合格", num: true, render: function (r) { return F.qty(r.goodQty); } },
            { label: "操作员", key: "operator" },
            { label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.reportedAt) + "</span>"; } }
          ], b.reports || [], { empty: "无报工记录" });

          document.getElementById("trResult").innerHTML = html;
          document.getElementById("trBatch").value = no;
          F.setStatus("批次 " + no + " · " + d.nodeCount + " 个节点");
        }).catch(function (e) { F.toast(e.message, "err"); });
      }).catch(function (e) {
        document.getElementById("trResult").innerHTML = '<div class="empty-hint">' + F.esc(e.message) + "</div>";
      });
    }

    document.getElementById("trGo").addEventListener("click", function () {
      show(document.getElementById("trBatch").value.trim());
    });
    document.getElementById("trBatch").addEventListener("keydown", function (e) {
      if (e.key === "Enter") show(e.target.value.trim());
    });
    loadList();
    if (params && params.batch) show(params.batch);
  });
})(window, document);

</script>
<script>
/* 飞驰 MES · 质量检验、不良处置与过程能力 */
(function (window, document) {
  "use strict";
  var F = window.F;
  var TYPES = ["全部", "首件", "巡检", "完工检", "来料检"];
  var tab = "insp";

  F.register("quality", function () {
    var view = document.getElementById("view");
    view.innerHTML = '<div class="panel"><div class="panel-title">质量总览' +
      '<span class="panel-actions small muted">本月口径</span></div>' +
      '<div class="panel-body" id="qKpi">加载中…</div></div>' +
      '<div class="panel"><div class="panel-title">质量作业' +
      '<span class="panel-actions"><button class="btn sm" id="qNewInsp">登记检验</button> ' +
      '<button class="btn sm" id="qNewDef">登记不良</button></span></div>' +
      '<div class="panel-body"><div id="qTabs" class="chips"></div><div id="qBody"></div></div></div>';

    var type = "全部";

    function loadKpi() {
      F.api("GET", "/api/quality/summary").then(function (d) {
        document.getElementById("qKpi").innerHTML =
          '<div class="kpi-grid six">' +
          '<div class="kpi green"><div class="k-label">一次良率</div><div class="k-value">' +
          F.pct(d.yieldRate, 2) + '</div><div class="k-sub">PPM ' + F.int(d.ppm) + "</div></div>" +
          '<div class="kpi"><div class="k-label">首件合格率</div><div class="k-value">' +
          F.pct(d.faiPassRate, 1) + '</div><div class="k-sub">未做首件不得开工</div></div>' +
          '<div class="kpi"><div class="k-label">完工检合格率</div><div class="k-value">' +
          F.pct(d.fqcPassRate, 1) + '</div><div class="k-sub">让步 ' + d.concession +
          " · 退货 " + d.rejected + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">巡检异常</div><div class="k-value">' +
          d.patrolAbnormal + '</div><div class="k-sub">检验单 ' + d.inspCount + " 张</div></div>" +
          '<div class="kpi red"><div class="k-label">不良待处置</div><div class="k-value">' +
          d.pendingDispose + '</div><div class="k-sub">累计不良 ' + F.qty(d.defectQty) + " 件</div></div>" +
          '<div class="kpi"><div class="k-label">质量趋势</div><div class="k-value" style="font-size:15px">' +
          F.pct((d.trend[d.trend.length - 1] || {}).yieldRate || 0, 2) +
          '</div><div class="k-sub">昨日良率</div></div></div>' +
          '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:8px">' +
          '<div><div class="small muted" style="margin-bottom:4px">近 14 天良率</div>' +
          F.lineChart([{ name: "良率", data: (d.trend || []).map(function (t) { return t.yieldRate * 100; }) }],
            { labels: (d.trend || []).map(function (t) { return t.day; }), height: 170, colors: ["#2f8f5b"],
              zero: false }) + "</div>" +
          '<div><div class="small muted" style="margin-bottom:4px">不良帕累托（TOP 8）</div>' +
          F.barChart((d.pareto || []).slice(0, 8).map(function (p) {
            return { label: String(p.name).slice(0, 4), value: p.qty, label2: F.qty(p.qty),
              color: p.key ? "#b4463a" : "#8fb3c4" };
          }), { height: 170 }) + "</div></div>";
        F.setSide('<div class="side-block"><div class="hd">质量判定口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">首件：零缺陷才合格；巡检：发现不良即异常；' +
          "完工检：不良率 ≤ 报废预警阈值判让步接收，超阈值退货。只有合格与让步接收允许入库。</div></div>" +
          '<div class="side-block"><div class="hd">不良 TOP</div><div class="bd">' +
          (d.pareto || []).slice(0, 6).map(function (p) {
            return F.kv(String(p.name).slice(0, 10), F.qty(p.qty) + " · " + F.pct(p.share, 1));
          }).join("") + "</div></div>");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function paintTabs() {
      document.getElementById("qTabs").innerHTML =
        [["insp", "检验单"], ["defect", "不良记录"], ["cpk", "过程能力"]].map(function (t) {
          return '<button class="chip' + (tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' +
            t[1] + "</button>";
        }).join("") + (tab === "insp" ? '<span style="margin-left:10px">' + F.chips(TYPES, type) + "</span>" : "");
      document.querySelectorAll("#qTabs [data-tab]").forEach(function (b) {
        b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); paintTabs(); loadBody(); });
      });
      document.querySelectorAll("#qTabs .chip[data-st]").forEach(function (c) {
        c.addEventListener("click", function () { type = c.getAttribute("data-st"); paintTabs(); loadBody(); });
      });
    }

    function loadBody() {
      if (tab === "insp") {
        F.api("GET", "/api/inspections?" + F.qs({ type: type === "全部" ? "" : type })).then(function (d) {
          document.getElementById("qBody").innerHTML = F.table([
            { label: "检验单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "类型", render: function (r) { return F.tag(r.type); } },
            { label: "工单", render: function (r) { return '<span class="mono small">' + F.esc(r.woNo) + "</span>"; } },
            { label: "工序", render: function (r) { return F.esc(r.process); } },
            { label: "抽样", num: true, render: function (r) { return F.qty(r.sampleQty); } },
            { label: "不良", num: true, render: function (r) { return F.qty(r.defectQty); } },
            { label: "不良率", num: true, render: function (r) { return F.pct(r.defectRate, 2); } },
            { label: "结论", render: function (r) { return F.tag(r.result); } },
            { label: "检验员", render: function (r) { return F.esc(r.inspectorName); } },
            { label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.inspectedAt) + "</span>"; } }
          ], d.list, { empty: "暂无检验单", click: function (r) { return r.no; } });
          F.bindRows(document, function (no) { showInsp(no); });
          F.setStatus("检验单 · " + d.total + " 张");
        }).catch(function (e) { F.toast(e.message, "err"); });
      } else if (tab === "defect") {
        F.api("GET", "/api/defects").then(function (d) {
          document.getElementById("qBody").innerHTML =
            '<div class="small muted" style="margin-bottom:6px">共 ' + d.total + " 条 · 待处置 " +
            d.pending + " 条 · 累计 " + F.qty(d.qty) + " 件</div>" + F.table([
              { label: "工单", render: function (r) { return '<span class="mono small">' + F.esc(r.woNo) + "</span>"; } },
              { label: "不良代码", render: function (r) { return F.esc(r.code) + ' <span class="muted small">' +
                F.esc(r.name) + "</span>"; } },
              { label: "类别", render: function (r) { return F.tag(r.category, "gray"); } },
              { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
              { label: "工序 / 设备", render: function (r) { return F.esc(r.process) +
                '<div class="muted small mono">' + F.esc(r.equipment || "") + "</div>"; } },
              { label: "发生时间", render: function (r) { return '<span class="small">' + F.esc(r.occurAt) + "</span>"; } },
              { label: "处置", render: function (r) { return F.tag(r.disposition); } },
              { label: "", render: function (r) {
                if (r.disposition !== "待处置") return "";
                if (!F.can("inspect")) return "";
                return '<button class="btn sm" data-disp="' + r.id + '">处置</button>';
              } }
            ], d.list, { empty: "暂无不良记录" });
          document.querySelectorAll("[data-disp]").forEach(function (b) {
            b.addEventListener("click", function () { dispose(Number(b.getAttribute("data-disp"))); });
          });
          F.setStatus("不良记录 · " + d.total + " 条");
        }).catch(function (e) { F.toast(e.message, "err"); });
      } else {
        F.api("GET", "/api/cpk").then(function (d) {
          document.getElementById("qBody").innerHTML =
            '<div class="small muted" style="margin-bottom:6px">样本 ' + d.samples + " 个 · 特性 " +
            d.items + " 项（Cpk 下限 1.33）</div>" + F.table([
              { label: "检验特性", key: "item" },
              { label: "样本", num: true, render: function (r) { return r.n; } },
              { label: "下限 LSL", num: true, render: function (r) { return r.lsl; } },
              { label: "上限 USL", num: true, render: function (r) { return r.usl; } },
              { label: "均值", num: true, render: function (r) { return r.mean; } },
              { label: "极值", num: true, render: function (r) { return r.min + " ~ " + r.max; } },
              { label: "Cpk", num: true, render: function (r) {
                return r.cpk === null ? "—" : '<b>' + Number(r.cpk).toFixed(2) + "</b>"; } },
              { label: "评价", render: function (r) { return F.tag(r.level); } }
            ], d.list, { empty: "暂无测量数据" });
          F.setStatus("过程能力 · " + d.items + " 项特性");
        }).catch(function (e) { F.toast(e.message, "err"); });
      }
    }

    function showInsp(no) {
      F.api("GET", "/api/inspections/" + encodeURIComponent(no)).then(function (d) {
        var items = F.table([
          { label: "检验项", key: "item" },
          { label: "实测值", num: true, render: function (r) { return r.value; } },
          { label: "下限", num: true, render: function (r) { return r.lsl; } },
          { label: "上限", num: true, render: function (r) { return r.usl; } },
          { label: "判定", render: function (r) { return F.tag(r.result); } }
        ], d.items, { empty: "该检验单无测量项" });
        F.dialog("检验单 " + d.no,
          '<div class="kpi-grid four" style="margin-bottom:10px">' +
          '<div class="kpi"><div class="k-label">类型</div><div class="k-value" style="font-size:16px">' +
          F.tag(d.type) + '</div><div class="k-sub">' + F.esc(d.woNo) + "</div></div>" +
          '<div class="kpi"><div class="k-label">抽样 / 不良</div><div class="k-value" style="font-size:16px">' +
          F.qty(d.sampleQty) + " / " + F.qty(d.defectQty) + '</div><div class="k-sub">不良率 ' +
          F.pct(d.defectRate, 2) + "</div></div>" +
          '<div class="kpi"><div class="k-label">结论</div><div class="k-value" style="font-size:16px">' +
          F.tag(d.result) + '</div><div class="k-sub">' + F.esc(d.standard) + "</div></div>" +
          '<div class="kpi"><div class="k-label">Cpk</div><div class="k-value" style="font-size:16px">' +
          (d.cpk === null ? "—" : Number(d.cpk).toFixed(2)) + '</div><div class="k-sub">检验员 ' +
          F.esc(d.inspectorName) + "</div></div></div>" +
          '<div class="section-title">测量项</div>' + items +
          '<div class="section-title">关联不良</div>' + F.table([
            { label: "代码", key: "code" },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "处置", render: function (r) { return F.tag(r.disposition); } }
          ], d.defects, { empty: "无不良" }),
          '<span class="small muted">检验时间 ' + F.esc(d.inspectedAt) + "</span>");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function dispose(id) {
      F.dialog("不良处置",
        '<div class="form-grid"><label>处置方式</label><select id="dpWay">' +
        "<option>返修</option><option>报废</option><option>让步接收</option><option>退货</option></select>" +
        '<label>说明</label><input id="dpRemark" placeholder="选填"></div>',
        '<button class="btn" id="dpOk">提交</button>');
      document.getElementById("dpOk").addEventListener("click", function () {
        F.api("POST", "/api/defects/" + id + "/dispose", {
          disposition: document.getElementById("dpWay").value,
          remark: document.getElementById("dpRemark").value
        }).then(function () {
          F.closeDialog();
          F.toast("处置完成", "ok");
          loadKpi();
          loadBody();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    }

    document.getElementById("qNewInsp").addEventListener("click", function () {
      if (!F.can("inspect")) return F.toast("当前角色无质检权限", "err");
      F.api("GET", "/api/orders?status=已开工").then(function (a) {
        F.api("GET", "/api/orders?status=已完工").then(function (b) {
          var list = (a.list || []).concat(b.list || []);
          if (!list.length) return F.toast("没有在制或待检工单", "err");
          F.dialog("登记检验",
            '<div class="form-grid">' +
            '<label>工单</label><select id="niWo">' + list.map(function (w) {
              return '<option value="' + F.esc(w.no) + '">' + F.esc(w.no + " " + w.materialName) + "</option>";
            }).join("") + "</select>" +
            '<label>类型</label><select id="niType"><option>首件</option><option>巡检</option>' +
            "<option>完工检</option><option>来料检</option></select>" +
            '<label>抽样数</label><input id="niSample" type="number" value="5">' +
            '<label>不良数</label><input id="niDefect" type="number" value="0">' +
            '<label>被测值</label><input id="niVal" type="number" step="0.001" value="100.0">' +
            '<label>公差下限</label><input id="niLsl" type="number" step="0.001" value="99.7">' +
            '<label>公差上限</label><input id="niUsl" type="number" step="0.001" value="100.3">' +
            '<label>说明</label><input id="niRemark" placeholder="选填"></div>',
            '<button class="btn primary" id="niOk">提交</button>');
          document.getElementById("niOk").addEventListener("click", function () {
            var body = {
              woNo: document.getElementById("niWo").value,
              type: document.getElementById("niType").value,
              sampleQty: Number(document.getElementById("niSample").value || 0),
              defectQty: Number(document.getElementById("niDefect").value || 0),
              remark: document.getElementById("niRemark").value
            };
            if (body.type !== "巡检") {
              body.items = [{ item: "关键尺寸", value: Number(document.getElementById("niVal").value),
                lsl: Number(document.getElementById("niLsl").value),
                usl: Number(document.getElementById("niUsl").value) }];
            }
            F.api("POST", "/api/inspections", body).then(function (x) {
              F.closeDialog();
              F.toast("检验完成：" + x.result, x.result === "合格" ? "ok" : "err");
              loadKpi();
              loadBody();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    });

    document.getElementById("qNewDef").addEventListener("click", function () {
      if (!F.can("inspect")) return F.toast("当前角色无质检权限", "err");
      F.api("GET", "/api/defect-codes").then(function (c) {
        F.api("GET", "/api/orders?status=已开工").then(function (o) {
          var list = (o.list || []);
          if (!list.length) return F.toast("没有在制工单", "err");
          F.dialog("登记不良",
            '<div class="form-grid">' +
            '<label>工单</label><select id="ndWo">' + list.map(function (w) {
              return '<option value="' + F.esc(w.no) + '">' + F.esc(w.no + " " + w.materialName) + "</option>";
            }).join("") + "</select>" +
            '<label>不良代码</label><select id="ndCode">' + (c.list || []).map(function (x) {
              return '<option value="' + F.esc(x.code) + '">' + F.esc(x.code + " " + x.name) + "</option>";
            }).join("") + "</select>" +
            '<label>数量</label><input id="ndQty" type="number" value="1">' +
            '<label>工序</label><input id="ndProc" placeholder="如 整机装配">' +
            '<label>说明</label><input id="ndRemark" placeholder="选填"></div>',
            '<button class="btn" id="ndOk">登记</button>');
          document.getElementById("ndOk").addEventListener("click", function () {
            F.api("POST", "/api/defects", {
              woNo: document.getElementById("ndWo").value,
              defectCode: document.getElementById("ndCode").value,
              qty: Number(document.getElementById("ndQty").value || 0),
              process: document.getElementById("ndProc").value,
              remark: document.getElementById("ndRemark").value
            }).then(function () {
              F.closeDialog();
              F.toast("不良已登记", "ok");
              tab = "defect";
              paintTabs();
              loadKpi();
              loadBody();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    });

    loadKpi();
    paintTabs();
    loadBody();
  });
})(window, document);

</script>
<script>
/* 飞驰 MES · 设备台账（OEE）与保养点检 */
(function (window, document) {
  "use strict";
  var F = window.F;
  var STATES = ["全部", "运行", "待机", "故障", "保养", "停机"];

  /* ---------------------------------------------------------- 设备台账 */
  F.register("equipment", function () {
    var st = { status: "全部", kw: "" };
    document.getElementById("view").innerHTML =
      '<div class="panel"><div class="panel-title">设备台账与 OEE' +
      '<span class="panel-actions">' +
      '<input id="eKw" placeholder="设备编码 / 名称 / 型号" style="width:200px;margin-right:6px">' +
      '<button class="btn sm" id="eSearch">查询</button> ' +
      '<a class="btn sm" href="#maint">保养点检</a></span></div>' +
      '<div class="panel-body"><div id="eKpi"></div><div id="eChips"></div><div id="eList">加载中…</div></div></div>';

    function load() {
      F.api("GET", "/api/equipment?" + F.qs({ status: st.status, kw: st.kw })).then(function (d) {
        var list = d.list || [];
        var avg = list.length ? list.reduce(function (a, x) { return a + x.oee.oee; }, 0) / list.length : 0;
        var run = list.filter(function (x) { return x.status === "运行"; }).length;
        var bad = list.filter(function (x) { return x.status === "故障" || x.status === "停机"; }).length;
        var maint = list.filter(function (x) { return x.maintState === "逾期" || x.maintState === "临期"; }).length;
        document.getElementById("eKpi").innerHTML =
          '<div class="kpi-grid four" style="margin-bottom:10px">' +
          '<div class="kpi"><div class="k-label">设备总数</div><div class="k-value">' + d.total +
          '</div><div class="k-sub">运行 ' + run + " 台</div></div>" +
          '<div class="kpi"><div class="k-label">平均 OEE（近 7 天）</div><div class="k-value">' +
          F.pct(avg, 1) + '</div><div class="k-sub">目标 85%</div></div>' +
          '<div class="kpi red"><div class="k-label">故障 / 停机</div><div class="k-value">' + bad +
          '</div><div class="k-sub">需处理</div></div>' +
          '<div class="kpi gold"><div class="k-label">保养临期 / 逾期</div><div class="k-value">' + maint +
          '</div><div class="k-sub">按保养计划</div></div></div>';
        document.getElementById("eChips").innerHTML = F.chips(STATES, st.status);
        document.getElementById("eList").innerHTML = F.table([
          { label: "设备", render: function (r) { return '<b>' + F.esc(r.name) + '</b><div class="muted small mono">' +
            F.esc(r.code) + " · " + F.esc(r.model) + "</div>"; } },
          { label: "类型", render: function (r) { return F.tag(r.type, "gray"); } },
          { label: "产线 / 工位", render: function (r) { return F.esc(r.line) +
            '<div class="muted small">' + F.esc(r.station) + "</div>"; } },
          { label: "状态", render: function (r) { return F.tag(r.status); } },
          { label: "OEE", num: true, render: function (r) {
            return '<b>' + F.pct(r.oee.oee, 1) + "</b> " + F.tag(r.oeeLevel);
          } },
          { label: "可用率", num: true, render: function (r) { return F.pct(r.oee.availability, 0); } },
          { label: "性能率", num: true, render: function (r) { return F.pct(r.oee.performance, 0); } },
          { label: "质量率", num: true, render: function (r) { return F.pct(r.oee.quality, 1); } },
          { label: "下次保养", render: function (r) { return F.esc(r.nextMaintAt) + " " + F.tag(r.maintState); } }
        ], list, { empty: "没有匹配设备", click: function (r) { return r.code; } });
        F.bindRows(document, function (code) { detail(code); });
        document.querySelectorAll("#eChips .chip").forEach(function (c) {
          c.addEventListener("click", function () { st.status = c.getAttribute("data-st"); load(); });
        });
        F.setStatus("设备台账 · " + d.total + " 台 · 平均 OEE " + F.pct(avg, 1));
        F.setSide('<div class="side-block"><div class="hd">OEE 口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">OEE = 可用率 × 性能率 × 质量率。<br>' +
          "可用率 = 运行时间 ÷ 计划开机；<br>性能率 = 理论节拍 × 产出 ÷ 运行时间；<br>" +
          "质量率 = 良品 ÷ 产出。</div></div>" +
          '<div class="side-block"><div class="hd">状态计数</div><div class="bd">' +
          Object.keys(d.statusDist || {}).map(function (k) {
            return F.kv(k, d.statusDist[k] + " 台");
          }).join("") + "</div></div>");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    document.getElementById("eSearch").addEventListener("click", function () {
      st.kw = document.getElementById("eKw").value.trim();
      load();
    });
    document.getElementById("eKw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { st.kw = e.target.value.trim(); load(); }
    });
    load();
  });

  function detail(code) {
    F.api("GET", "/api/equipment/" + encodeURIComponent(code)).then(function (d) {
      var o = d.oee14 || d.oee;
      var logs = F.table([
        { label: "状态", render: function (r) { return F.tag(r.status); } },
        { label: "原因", key: "reason" },
        { label: "时长", num: true, render: function (r) { return r.minutes ? F.hour(r.minutes) : "进行中"; } },
        { label: "开始", render: function (r) { return '<span class="small">' + F.esc(r.startAt) + "</span>"; } },
        { label: "结束", render: function (r) { return '<span class="small">' + F.esc(r.endAt || "—") + "</span>"; } }
      ], d.logs || [], { empty: "无状态记录" });
      var checks = F.table([
        { label: "点检单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
        { label: "类型", key: "type" },
        { label: "结论", render: function (r) { return F.tag(r.result); } },
        { label: "点检人", key: "checker" },
        { label: "时间", render: function (r) { return '<span class="small">' + F.esc(r.checkedAt) + "</span>"; } }
      ], d.checks || [], { empty: "无点检记录" });
      var maint = F.table([
        { label: "工单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
        { label: "类型", key: "type" },
        { label: "原因", key: "reason" },
        { label: "状态", render: function (r) { return F.tag(r.status); } },
        { label: "停机", num: true, render: function (r) { return r.downtimeMin ? F.hour(r.downtimeMin) : "—"; } },
        { label: "费用", num: true, render: function (r) { return F.num(r.cost, 0); } }
      ], d.maint || [], { empty: "无保养工单" });

      var body = '<div class="detail-head"><b>' + F.esc(d.name) + '</b><span class="muted small mono">' +
        F.esc(d.code) + " · " + F.esc(d.vendor) + " " + F.esc(d.model) + "</span>" +
        '<span class="spacer"></span>' + F.tag(d.status) + "</div>" +
        '<div class="oee-flex" style="margin:10px 0">' + F.ring(o.oee, { label: "OEE" }) +
        '<div class="oee-legend">可用率 <b>' + F.pct(o.availability, 1) + "</b>（运行 " + F.hour(o.runMin) +
        " / 计划 " + F.hour(o.planMin) + "，损失 " + F.hour(o.downMin) + "）<br>" +
        "性能率 <b>" + F.pct(o.performance, 1) + "</b>（产出 " + F.qty(o.output) + " 件）<br>" +
        "质量率 <b>" + F.pct(o.quality, 1) + "</b>（良品 " + F.qty(o.good) + " 件）<br>" +
        "OEE 目标 " + F.pct(d.oeeTarget, 0) + " · " + F.tag(d.oeeLevel) + "</div></div>" +
        '<div class="section-title">近 14 天 OEE</div>' +
        F.lineChart([{ name: "OEE", data: (d.daily || []).map(function (x) { return x.oee * 100; }) }],
          { labels: (d.daily || []).map(function (x) { return x.day.slice(3); }), height: 150,
            colors: ["#1f7a8c"], zero: false }) +
        '<div class="section-title">停机原因 TOP</div>' + F.table([
          { label: "原因", key: "reason" },
          { label: "时长", num: true, render: function (r) { return F.hour(r.minutes); } },
          { label: "占比", num: true, render: function (r) { return F.pct(r.share, 1); } }
        ], d.downtimeTop || [], { empty: "暂无停机" }) +
        '<div class="section-title">状态记录</div>' + logs +
        '<div class="section-title">点检记录</div>' + checks +
        '<div class="section-title">保养工单</div>' + maint;

      var foot = "";
      if (F.can("equip")) {
        foot = '<button class="btn sm" data-es="故障">报修</button> ' +
          '<button class="btn sm" data-es="保养">转保养</button> ' +
          '<button class="btn sm primary" data-es="运行">恢复运行</button> ' +
          '<button class="btn sm" id="edMaint">新建保养工单</button>';
      }
      F.dialog("设备 " + d.code, body, foot || '<span class="small muted">当前角色只读</span>');
      document.querySelectorAll("[data-es]").forEach(function (b) {
        b.addEventListener("click", function () {
          var target = b.getAttribute("data-es");
          var reason = target === "运行" ? "修复复位" :
            window.prompt("请输入" + target + "原因", target === "故障" ? "设备异常停机" : "计划保养");
          if (!reason) return;
          F.api("POST", "/api/equipment/" + d.code + "/status", { status: target, reason: reason })
            .then(function () {
              F.closeDialog();
              F.toast("设备状态已切换为「" + target + "」", "ok");
              F.reload().then(function () { detail(d.code); });
            }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      var mb = document.getElementById("edMaint");
      if (mb) mb.addEventListener("click", function () {
        F.api("POST", "/api/maint/orders", { equipment: d.code, type: "计划保养", reason: "设备详情发起" })
          .then(function (x) {
            F.closeDialog();
            F.toast("已创建保养工单 " + x.no, "ok");
            F.reload().then(function () { F.go("maint"); });
          }).catch(function (e) { F.toast(e.message, "err"); });
      });
    }).catch(function (e) { F.toast(e.message, "err"); });
  }

  /* ---------------------------------------------------------- 保养点检 */
  var tab = "plan";

  F.register("maint", function () {
    document.getElementById("view").innerHTML =
      '<div class="panel"><div class="panel-title">保养与点检' +
      '<span class="panel-actions"><button class="btn sm" id="mnNew">新建保养工单</button> ' +
      '<button class="btn sm" id="mnCheck">提交点检</button></span></div>' +
      '<div class="panel-body"><div id="mnTabs"></div><div id="mnBody">加载中…</div></div></div>';

    function paint() {
      document.getElementById("mnTabs").innerHTML =
        [["plan", "保养计划"], ["order", "保养工单"], ["check", "点检记录"]].map(function (t) {
          return '<button class="chip' + (tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' +
            t[1] + "</button>";
        }).join("");
      document.querySelectorAll("#mnTabs [data-tab]").forEach(function (b) {
        b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); paint(); load(); });
      });
    }

    function load() {
      if (tab === "plan") {
        F.api("GET", "/api/maint/plans").then(function (d) {
          document.getElementById("mnBody").innerHTML =
            '<div class="small muted" style="margin-bottom:6px">共 ' + d.total + " 项计划 · 临期/逾期 " +
            d.due + " 项</div>" + F.table([
              { label: "计划", render: function (r) { return '<span class="mono small">' + F.esc(r.code) + "</span>"; } },
              { label: "设备", render: function (r) { return F.esc(r.equipName) +
                '<div class="muted small mono">' + F.esc(r.equipment) + "</div>"; } },
              { label: "类型", render: function (r) { return F.tag(r.type, "blue"); } },
              { label: "周期", num: true, render: function (r) { return r.cycleDays + " 天"; } },
              { label: "上次", key: "lastAt" },
              { label: "下次", render: function (r) { return F.esc(r.nextAt) + " " + F.tag(r.state); } },
              { label: "负责人", key: "owner" }
            ], d.list, { empty: "暂无保养计划" });
          F.setStatus("保养计划 · " + d.total + " 项");
        }).catch(function (e) { F.toast(e.message, "err"); });
      } else if (tab === "order") {
        F.api("GET", "/api/maint/orders").then(function (d) {
          document.getElementById("mnBody").innerHTML =
            '<div class="small muted" style="margin-bottom:6px">共 ' + d.total + " 单 · 未完成 " +
            d.open + " 单</div>" + F.table([
              { label: "工单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "设备", render: function (r) { return F.esc(r.equipName) +
                '<div class="muted small mono">' + F.esc(r.equipment) + "</div>"; } },
              { label: "类型 / 原因", render: function (r) { return F.esc(r.type) +
                '<div class="muted small">' + F.esc(r.reason) + "</div>"; } },
              { label: "状态", render: function (r) { return F.tag(r.status); } },
              { label: "计划", key: "planAt" },
              { label: "停机", num: true, render: function (r) { return r.downtimeMin ? F.hour(r.downtimeMin) : "—"; } },
              { label: "费用", num: true, render: function (r) { return F.num(r.cost, 0); } },
              { label: "", render: function (r) {
                if (r.status === "已完成" || !F.can("equip")) return "";
                return '<button class="btn sm" data-fin="' + F.esc(r.no) + '">完成</button>';
              } }
            ], d.list, { empty: "暂无保养工单" });
          document.querySelectorAll("[data-fin]").forEach(function (b) {
            b.addEventListener("click", function () { finish(b.getAttribute("data-fin")); });
          });
          F.setStatus("保养工单 · " + d.total + " 单");
        }).catch(function (e) { F.toast(e.message, "err"); });
      } else {
        F.api("GET", "/api/equip/checks").then(function (d) {
          document.getElementById("mnBody").innerHTML =
            '<div class="small muted" style="margin-bottom:6px">共 ' + d.total + " 条 · 异常 " +
            d.abnormal + " 条</div>" + F.table([
              { label: "点检单", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "设备", render: function (r) { return F.esc(r.equipName) +
                '<div class="muted small mono">' + F.esc(r.equipment) + "</div>"; } },
              { label: "类型", key: "type" },
              { label: "结论", render: function (r) { return F.tag(r.result); } },
              { label: "点检项", render: function (r) {
                return (r.items || []).map(function (i) {
                  return '<span class="tag ' + (i.result === "正常" ? "green" : "red") + '">' +
                    F.esc(i.item) + "</span>";
                }).join(" ");
              } },
              { label: "点检人", key: "checker" },
              { label: "时间", render: function (r) { return '<span class="small">' + F.esc(r.checkedAt) + "</span>"; } }
            ], d.list, { empty: "暂无点检记录" });
          F.setStatus("点检记录 · " + d.total + " 条");
        }).catch(function (e) { F.toast(e.message, "err"); });
      }
    }

    function finish(no) {
      F.dialog("完成保养 " + no,
        '<div class="form-grid"><label>停机时长(分)</label><input id="mfDown" type="number" value="60">' +
        '<label>费用(元)</label><input id="mfCost" type="number" value="800">' +
        '<label>说明</label><input id="mfRemark" placeholder="保养内容"></div>',
        '<button class="btn primary" id="mfOk">确认完成</button>');
      document.getElementById("mfOk").addEventListener("click", function () {
        F.api("POST", "/api/maint/orders/" + encodeURIComponent(no) + "/finish", {
          downtimeMin: Number(document.getElementById("mfDown").value || 0),
          cost: Number(document.getElementById("mfCost").value || 0),
          remark: document.getElementById("mfRemark").value
        }).then(function () {
          F.closeDialog();
          F.toast("保养已完成，设备已恢复运行", "ok");
          F.reload().then(load);
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    }

    document.getElementById("mnNew").addEventListener("click", function () {
      if (!F.can("equip")) return F.toast("当前角色无设备权限", "err");
      F.api("GET", "/api/equipment").then(function (d) {
        F.dialog("新建保养工单",
          '<div class="form-grid"><label>设备</label><select id="mnEq">' +
          (d.list || []).map(function (e) {
            return '<option value="' + F.esc(e.code) + '">' + F.esc(e.code + " " + e.name) + "</option>";
          }).join("") + "</select>" +
          '<label>类型</label><select id="mnType"><option>计划保养</option><option>故障维修</option>' +
          "<option>点检异常</option></select>" +
          '<label>计划日期</label><input id="mnDate" type="date" value="' + F.today() + '">' +
          '<label>原因</label><input id="mnReason" placeholder="如 主轴异响"></div>',
          '<button class="btn" id="mnOk">创建</button>');
        document.getElementById("mnOk").addEventListener("click", function () {
          F.api("POST", "/api/maint/orders", {
            equipment: document.getElementById("mnEq").value,
            type: document.getElementById("mnType").value,
            planAt: document.getElementById("mnDate").value,
            reason: document.getElementById("mnReason").value
          }).then(function (x) {
            F.closeDialog();
            F.toast("已创建 " + x.no, "ok");
            tab = "order";
            paint();
            load();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    });

    document.getElementById("mnCheck").addEventListener("click", function () {
      if (!F.can("equip")) return F.toast("当前角色无设备权限", "err");
      F.api("GET", "/api/equipment").then(function (d) {
        F.dialog("设备点检",
          '<div class="form-grid"><label>设备</label><select id="ckEq">' +
          (d.list || []).map(function (e) {
            return '<option value="' + F.esc(e.code) + '">' + F.esc(e.code + " " + e.name) + "</option>";
          }).join("") + "</select>" +
          '<label>类型</label><select id="ckType"><option>日常点检</option><option>周检</option>' +
          "<option>月检</option></select>" +
          '<label>油位</label><select id="ckOil"><option>正常</option><option>异常</option></select>' +
          '<label>气压</label><select id="ckAir"><option>正常</option><option>异常</option></select>' +
          '<label>安全门</label><select id="ckDoor"><option>正常</option><option>异常</option></select>' +
          '<label>说明</label><input id="ckRemark" placeholder="选填"></div>' +
          '<div class="small muted" style="margin-top:8px">任一项异常将把设备置为「故障」并提示处理。</div>',
          '<button class="btn primary" id="ckOk">提交</button>');
        document.getElementById("ckOk").addEventListener("click", function () {
          F.api("POST", "/api/equip/checks", {
            equipment: document.getElementById("ckEq").value,
            type: document.getElementById("ckType").value,
            items: [
              { item: "油位", result: document.getElementById("ckOil").value },
              { item: "气压", result: document.getElementById("ckAir").value },
              { item: "安全门", result: document.getElementById("ckDoor").value }
            ],
            remark: document.getElementById("ckRemark").value
          }).then(function (x) {
            F.closeDialog();
            F.toast("点检已提交：" + x.result, x.result === "正常" ? "ok" : "err");
            tab = "check";
            paint();
            F.reload().then(load);
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    });

    paint();
    load();
  });
})(window, document);

</script>
<script>
/* 飞驰 MES · 库存台账与报表分析 */
(function (window, document) {
  "use strict";
  var F = window.F;

  /* ---------------------------------------------------------- 库存台账 */
  F.register("stock", function () {
    var st = { wh: "全部", kw: "" };
    document.getElementById("view").innerHTML =
      '<div class="panel"><div class="panel-title">库存台账' +
      '<span class="panel-actions">' +
      '<input id="skKw" placeholder="物料 / 批次" style="width:180px;margin-right:6px">' +
      '<button class="btn sm" id="skSearch">查询</button></span></div>' +
      '<div class="panel-body"><div id="skKpi"></div><div id="skChips"></div>' +
      '<div id="skList">加载中…</div></div></div>';

    function load() {
      F.api("GET", "/api/stock?" + F.qs({ warehouse: st.wh, kw: st.kw })).then(function (d) {
        document.getElementById("skKpi").innerHTML =
          '<div class="kpi-grid four" style="margin-bottom:10px">' +
          '<div class="kpi"><div class="k-label">库存行</div><div class="k-value">' + d.summary.rows +
          '</div><div class="k-sub">按批次展开</div></div>' +
          '<div class="kpi"><div class="k-label">库存总量</div><div class="k-value">' +
          F.wan(d.summary.qty) + '</div><div class="k-sub">件 / 张 / 只</div></div>' +
          '<div class="kpi green"><div class="k-label">库存金额</div><div class="k-value">' +
          F.wan(d.summary.amount) + '</div><div class="k-sub">按标准成本</div></div>' +
          '<div class="kpi"><div class="k-label">仓库</div><div class="k-value">' +
          d.warehouses.length + '</div><div class="k-sub">' + F.esc(d.warehouses.join("、")) + "</div></div></div>";
        document.getElementById("skChips").innerHTML =
          F.chips(["全部"].concat(d.warehouses), st.wh);
        document.getElementById("skList").innerHTML = F.table([
          { label: "物料", render: function (r) { return F.esc(r.name) +
            '<div class="muted small mono">' + F.esc(r.materialCode) + "</div>"; } },
          { label: "仓库", render: function (r) { return F.tag(r.warehouse, "blue"); } },
          { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.batch) + "</span>"; } },
          { label: "数量", num: true, render: function (r) { return F.qty(r.qty) + " " + F.esc(r.unit); } },
          { label: "金额", num: true, render: function (r) { return F.wan(r.amount); } },
          { label: "更新时间", render: function (r) { return '<span class="small muted">' + F.esc(r.updatedAt) + "</span>"; } }
        ], d.list, { empty: "没有匹配的库存", click: function (r) { return r.batch; } });
        F.bindRows(document, function (batch) { F.go("trace", { batch: batch }); });
        document.querySelectorAll("#skChips .chip").forEach(function (c) {
          c.addEventListener("click", function () { st.wh = c.getAttribute("data-st"); load(); });
        });
        F.setStatus("库存台账 · " + d.total + " 行 · " + F.wan(d.summary.amount));
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    document.getElementById("skSearch").addEventListener("click", function () {
      st.kw = document.getElementById("skKw").value.trim();
      load();
    });
    document.getElementById("skKw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { st.kw = e.target.value.trim(); load(); }
    });
    load();
  });

  /* ---------------------------------------------------------- 报表分析 */
  var days = 14;

  F.register("reports", function () {
    document.getElementById("view").innerHTML =
      '<div class="panel"><div class="panel-title">经营与制造指标' +
      '<span class="panel-actions">' + F.chips(["7 天", "14 天", "30 天"], "14 天", "data-days") +
      " " + '<button class="btn sm" id="rpExport">导出工单</button></span></div>' +
      '<div class="panel-body" id="rpBody">加载中…</div></div>';

    function load() {
      F.api("GET", "/api/reports?days=" + days).then(function (d) {
        var p = d.production, o = d.oee, q = d.quality, e = d.equipment;
        var html = '<div class="kpi-grid six">' +
          '<div class="kpi"><div class="k-label">期间产出</div><div class="k-value">' + F.wan(p.output) +
          '</div><div class="k-sub">计划 ' + F.wan(p.plan) + " · 达成 " + F.pct(p.completion, 1) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">本月产出</div><div class="k-value">' +
          F.wan(p.monthOutput) + '</div><div class="k-sub">计划 ' + F.wan(p.monthPlan) + " · 达成 " +
          F.pct(p.monthCompletion, 1) + "</div></div>" +
          '<div class="kpi"><div class="k-label">综合 OEE</div><div class="k-value">' +
          F.pct(o.plant.oee, 1) + '</div><div class="k-sub">可用 ' + F.pct(o.plant.availability, 0) +
          " · 性能 " + F.pct(o.plant.performance, 0) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">一次良率</div><div class="k-value">' +
          F.pct(q.yieldRate, 2) + '</div><div class="k-sub">PPM ' + F.int(q.ppm) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">MTBF / MTTR</div><div class="k-value" style="font-size:17px">' +
          F.hour(e.mtbf) + " / " + F.hour(e.mttr) + '</div><div class="k-sub">故障 ' + e.failures +
          " 次 · 停机 " + F.hour(e.downMin) + "</div></div>" +
          '<div class="kpi red"><div class="k-label">保养到期</div><div class="k-value">' + e.maintDue +
          '</div><div class="k-sub">让步接收 ' + q.concession + " 批</div></div></div>";

        html += '<div class="panel" style="margin-top:10px"><div class="panel-title">产量与计划</div>' +
          '<div class="panel-body">' + F.lineChart([
            { name: "产出", data: p.trend.map(function (x) { return x.output; }) },
            { name: "计划", data: p.trend.map(function (x) { return x.plan; }) },
            { name: "不良", data: p.trend.map(function (x) { return x.ng; }) }
          ], { labels: p.trend.map(function (x) { return x.day; }),
            colors: ["#1f7a8c", "#c8963e", "#b4463a"] }) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">OEE 三率趋势' +
          '<span class="panel-actions small muted">目标 ' + F.pct(o.target, 0) + "</span></div>" +
          '<div class="panel-body">' + F.lineChart([
            { name: "OEE", data: o.trend.map(function (x) { return x.oee * 100; }) },
            { name: "可用率", data: o.trend.map(function (x) { return x.availability * 100; }) },
            { name: "性能率", data: o.trend.map(function (x) { return x.performance * 100; }) }
          ], { labels: o.trend.map(function (x) { return x.day; }), zero: false,
            colors: ["#1f7a8c", "#2f8f5b", "#c8963e"] }) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">质量与缺陷帕累托</div><div class="panel-body" ' +
          'style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
          "<div>" + F.barChart(q.pareto.slice(0, 8).map(function (x) {
            return { label: String(x.name).slice(0, 4), value: x.qty, label2: F.qty(x.qty),
              color: x.key ? "#b4463a" : "#8fb3c4" };
          }), { height: 170 }) + "</div>" +
          '<div class="small" style="line-height:2">' +
          F.kv("检验单", q.inspCount + " 张") +
          F.kv("首件合格率", F.pct(q.faiPassRate, 1)) +
          F.kv("完工检合格率", F.pct(q.fqcPassRate, 1)) +
          F.kv("巡检异常", q.patrolAbnormal + " 次") +
          F.kv("让步接收 / 退货", q.concession + " / " + q.rejected) +
          F.kv("不良待处置", q.pendingDispose + " 条") + "</div></div></div>";

        html += '<div class="panel"><div class="panel-title">产线负荷与平衡</div><div class="panel-body">' +
          F.table([
            { label: "产线", render: function (r) { return F.esc(r.name) +
              '<div class="muted small mono">' + F.esc(r.code) + "</div>"; } },
            { label: "在制", num: true, render: function (r) { return r.wip; } },
            { label: "标准工时", num: true, render: function (r) { return F.hour(r.stdMin); } },
            { label: "产出", num: true, render: function (r) { return F.qty(r.output); } },
            { label: "负荷", render: function (r) {
              return '<div class="tl">' + F.progress(r.load) + '<span class="small">' + F.pct(r.load, 0) + "</span></div>"; } },
            { label: "平衡率", num: true, render: function (r) { return F.pct(r.balance, 1); } }
          ], d.lines) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">设备 OEE 排名</div><div class="panel-body flush">' +
          F.table([
            { label: "设备", render: function (r) { return F.esc(r.name) + '<div class="muted small mono">' +
              F.esc(r.code) + " · " + F.esc(r.line) + "</div>"; } },
            { label: "OEE", num: true, render: function (r) {
              return '<div class="tl">' + F.progress(r.oee, r.oee >= 0.85 ? "" : "warn") + "<b>" +
                F.pct(r.oee, 1) + "</b></div>"; } },
            { label: "可用率", num: true, render: function (r) { return F.pct(r.availability, 0); } },
            { label: "性能率", num: true, render: function (r) { return F.pct(r.performance, 0); } },
            { label: "质量率", num: true, render: function (r) { return F.pct(r.quality, 1); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "评价", render: function (r) { return F.tag(r.level); } }
          ], e.rank) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">停机原因 TOP</div><div class="panel-body">' +
          F.barChart(e.downTop.map(function (x) {
            return { label: String(x.reason).slice(0, 5), value: x.minutes, label2: F.hour(x.minutes),
              color: x.reason === "设备故障" ? "#b4463a" : "#8fb3c4" };
          }), { height: 160 }) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">物料消耗 TOP</div><div class="panel-body flush">' +
          F.table([
            { label: "物料", render: function (r) { return F.esc(r.name) +
              '<div class="muted small mono">' + F.esc(r.materialCode) + "</div>"; } },
            { label: "消耗量", num: true, render: function (r) { return F.qty(r.qty) + " " + F.esc(r.unit); } },
            { label: "金额", num: true, render: function (r) { return F.wan(r.amount); } },
            { label: "占比", num: true, render: function (r) {
              return '<div class="tl">' + F.progress(r.share) + '<span class="small">' + F.pct(r.share, 1) + "</span></div>"; } }
          ], d.consumption) + "</div></div>";

        document.getElementById("rpBody").innerHTML = html;
        document.querySelectorAll("[data-days]").forEach(function (c) {
          c.addEventListener("click", function () {
            days = parseInt(c.getAttribute("data-days"), 10);
            document.querySelectorAll("[data-days]").forEach(function (x) { x.classList.remove("on"); });
            c.classList.add("on");
            load();
          });
        });
        document.getElementById("rpExport").addEventListener("click", function () {
          window.open("/api/export/orders", "_blank");
        });
        F.setStatus("报表分析 · 近 " + days + " 天 · OEE " + F.pct(o.plant.oee, 1) +
          " · 达成 " + F.pct(p.completion, 1));
        F.setSide('<div class="side-block"><div class="hd">指标口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">产出取工单末工序报工，避免逐工序重复计数；<br>' +
          "计划按工单计划期均摊；<br>负荷 = 需求标准工时 ÷ 可用工时（3 班 × 22 天）；<br>" +
          "MTBF = 运行时间 ÷ 故障次数，MTTR = 停机时间 ÷ 故障次数。</div></div>" +
          '<div class="side-block"><div class="hd">期间摘要</div><div class="bd">' +
          F.kv("产出", F.wan(p.output)) +
          F.kv("达成率", F.pct(p.completion, 1)) +
          F.kv("良率", F.pct(q.yieldRate, 2)) +
          F.kv("OEE", F.pct(o.plant.oee, 1)) + "</div></div>");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    load();
  });
})(window, document);

</script>
<script>
/* 飞驰 MES · 集成中心（API Key / Webhook / 投递 / 映射 / 增量同步） */
(function (window, document) {
  "use strict";
  var F = window.F;
  var tab = "overview";

  F.register("integration", function () {
    var view = document.getElementById("view");
    if (!F.isAdmin()) {
      view.innerHTML = '<div class="panel"><div class="panel-title">集成中心</div>' +
        '<div class="panel-body">' + F.empty("集成配置仅系统管理员可见（当前角色：" +
          (F.me().roleLabel || "—") + "）。如需对接，请联系管理员分配 API Key。") + "</div></div>";
      F.setStatus("集成中心 · 需要管理员权限");
      return;
    }

    view.innerHTML = '<div class="panel"><div class="panel-title">集成中心' +
      '<span class="panel-actions small muted">REST / Webhook / 增量同步 三通道</span></div>' +
      '<div class="panel-body"><div id="igTabs"></div><div id="igBody">加载中…</div></div></div>';

    function paint() {
      document.getElementById("igTabs").innerHTML =
        [["overview", "集成总览"], ["keys", "API Key"], ["hooks", "Webhook"],
          ["deliv", "投递记录"], ["map", "外部 ID 映射"], ["sync", "增量同步"]].map(function (t) {
          return '<button class="chip' + (tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' +
            t[1] + "</button>";
        }).join("");
      document.querySelectorAll("#igTabs [data-tab]").forEach(function (b) {
        b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); paint(); load(); });
      });
    }

    function load() {
      if (tab === "overview") {
        F.api("GET", "/api/integration/overview").then(function (d) {
          document.getElementById("igBody").innerHTML =
            '<div class="kpi-grid six">' +
            '<div class="kpi"><div class="k-label">启用 Key</div><div class="k-value">' + d.keys +
            '</div><div class="k-sub">读写 / 只读分离</div></div>' +
            '<div class="kpi"><div class="k-label">Webhook 订阅</div><div class="k-value">' + d.webhooks +
            '</div><div class="k-sub">HMAC 签名</div></div>' +
            '<div class="kpi gold"><div class="k-label">投递总数</div><div class="k-value">' + d.deliveries +
            '</div><div class="k-sub">失败 ' + d.deliveryFailed + " 条</div></div>" +
            '<div class="kpi"><div class="k-label">变更事件</div><div class="k-value">' + d.changes +
            '</div><div class="k-sub">最近 ' + F.esc(d.lastChange || "—") + "</div></div>" +
            '<div class="kpi"><div class="k-label">外部映射</div><div class="k-value">' + d.mappings +
            '</div><div class="k-sub">ERP / WMS / QMS</div></div>' +
            '<div class="kpi green"><div class="k-label">可同步对象</div><div class="k-value">' +
            d.objects.length + '</div><div class="k-sub">' + F.esc(d.objects.join("、")) + "</div></div></div>" +
            '<div class="section-title">数据规模</div>' +
            F.table([
              { label: "对象", render: function (r) { return F.esc(r.k); } },
              { label: "数量", num: true, render: function (r) { return F.int(r.v); } }
