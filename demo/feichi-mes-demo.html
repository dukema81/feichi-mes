<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞驰MES系统 · 离线演示版</title>
<style>
:root {
  --bg: #0f1c26;
  --bar: #12262f;
  --bar2: #1a3540;
  --line: #d8dee4;
  --ink: #1f2d38;
  --muted: #6b7a88;
  --accent: #1f7a8c;
  --accent2: #2b9eb3;
  --gold: #c8963e;
  --up: #c0392b;
  --down: #1e8449;
  --warn: #b7791f;
  --bg-soft: #f4f7f9;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg-soft);
}

a { color: var(--accent); text-decoration: none; }
.spacer { flex: 1; }
.mono { font-family: Consolas, "Courier New", monospace; }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.num { text-align: right; font-family: Consolas, monospace; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

/* ---------------------------------------------------------------- 应用骨架 */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 1180px;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 54px;
  padding: 0 14px;
  background: linear-gradient(180deg, #16323d, #10242c);
  color: #eaf2f5;
  border-bottom: 1px solid #0a171d;
}
.titlebar .brand { display: flex; align-items: center; gap: 10px; }
.titlebar .logo {
  width: 34px; height: 34px; line-height: 34px; text-align: center;
  background: linear-gradient(145deg, var(--accent2), var(--accent));
  border-radius: 8px; font-weight: 700; color: #fff; font-size: 17px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
}
.titlebar .co { font-size: 13px; font-weight: 600; letter-spacing: .5px; }
.titlebar .sys { font-size: 11px; color: #8fb0bd; margin-top: 2px; }
.titlebar .ver { font-size: 11px; color: #7f9dab; }
.titlebar .opuser { font-size: 12px; color: #cfe0e6; }
.titlebar .winbtns { display: flex; gap: 14px; margin-left: 12px; color: #9ab4bf; font-size: 12px; }
.titlebar .winbtns .close:hover { color: #ff8b7a; }

.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 36px;
  padding: 0 8px;
  background: var(--bar2);
  border-bottom: 1px solid #0d1e26;
}
.menubar button {
  background: transparent;
  border: 0;
  color: #cfe0e6;
  font-size: 12.5px;
  padding: 6px 13px;
  border-radius: 4px;
  cursor: pointer;
}
.menubar button:hover { background: rgba(255, 255, 255, .1); }
.menubar button.on { background: var(--accent); color: #fff; }

.body { display: flex; flex: 1; min-height: 0; }

.tree {
  width: 186px;
  background: #fff;
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 0;
}
.tree-title {
  font-size: 11.5px; color: var(--muted); padding: 6px 14px 8px;
  border-bottom: 1px solid #eef1f4; margin-bottom: 6px;
}
.tree .grp { font-size: 12px; color: var(--muted); padding: 8px 14px 4px; }
.tree a {
  display: block; padding: 7px 14px 7px 24px; color: #33434f; font-size: 12.5px;
  border-left: 3px solid transparent;
}
.tree a:hover { background: #f2f7f9; }
.tree a.on { background: #e8f4f7; color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabstrip {
  height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: #e9eef2; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.tabstrip .tab {
  background: #fff; border: 1px solid var(--line); border-bottom: 0;
  padding: 4px 12px; border-radius: 4px 4px 0 0; color: var(--ink);
}
.page { flex: 1; overflow: auto; padding: 12px; }

.side {
  width: 262px;
  background: #fff;
  border-left: 1px solid var(--line);
  overflow: auto;
  padding: 10px;
}
.side-block { border: 1px solid #e6ecf0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
.side-block .hd {
  background: #f3f7f9; padding: 7px 10px; font-size: 12px; font-weight: 600;
  color: #3b4c58; border-bottom: 1px solid #e6ecf0;
}
.side-block .bd { padding: 9px 10px; }
.side-kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.side-kv span { color: var(--muted); }

.statusbar {
  height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px;
  background: #16323d; color: #b9cdd6; font-size: 11.5px;
}
.statusbar b { color: #eaf2f5; font-weight: 600; }

/* ---------------------------------------------------------------- 通用块 */
.panel {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(16, 36, 44, .04);
}
.panel-title {
  padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #2c3e4a;
  border-bottom: 1px solid #edf1f4; display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 12px; }
.panel-body.flush { padding: 0; }
.panel-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi-grid.six { grid-template-columns: repeat(6, 1fr); }
.kpi-grid.three { grid-template-columns: repeat(3, 1fr); }
.kpi {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px;
  border-top: 3px solid var(--accent);
}
.kpi.gold { border-top-color: var(--gold); }
.kpi.green { border-top-color: var(--down); }
.kpi.red { border-top-color: var(--up); }
.kpi .k-label { font-size: 11.5px; color: var(--muted); }
.kpi .k-value { font-size: 21px; font-weight: 700; margin-top: 5px; letter-spacing: -.3px; }
.kpi .k-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

table.grid-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid-table th {
  background: #f4f7f9; text-align: left; padding: 8px 10px; font-weight: 600;
  color: #46586a; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid-table td { padding: 7px 10px; border-bottom: 1px solid #eef2f5; }
table.grid-table tbody tr:hover { background: #f8fbfc; }
table.grid-table tr.clickable { cursor: pointer; }
table.grid-table .empty-row td { text-align: center; color: var(--muted); padding: 26px; }
table.grid-table td.num, table.grid-table th.num { text-align: right; font-family: Consolas, monospace; }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
  background: #eef2f5; color: #55636f; line-height: 18px;
}
.tag.blue { background: #e3f1f5; color: #1f7a8c; }
.tag.green { background: #e6f4ec; color: #1e8449; }
.tag.red { background: #fbeae7; color: #c0392b; }
.tag.gold { background: #fbf2e0; color: #a9772a; }
.tag.gray { background: #eef2f5; color: #6b7a88; }

.btn {
  border: 1px solid var(--line); background: #fff; color: #33434f; padding: 5px 13px;
  border-radius: 4px; cursor: pointer; font-size: 12.5px;
}
.btn:hover { border-color: var(--accent2); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { color: var(--up); border-color: #eccdc9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }

input[type=text], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12.5px;
  color: var(--ink); background: #fff; outline: none; font-family: inherit;
}
input:focus, select:focus { border-color: var(--accent2); }
.form-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--muted); }

.msg-list { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.msg-list .err { color: var(--up); }
.msg-list .warn { color: var(--warn); }
.msg-list .pass { color: var(--down); }

.progress {
  height: 6px; background: #eef2f5; border-radius: 3px; overflow: hidden; width: 90px;
  display: inline-block; vertical-align: middle;
}
.progress i { display: block; height: 100%; background: var(--accent2); }

.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; }
.spark i { width: 4px; display: block; background: #cfd8de; }

/* 抽屉 / 弹窗 */
.mask {
  position: fixed; inset: 0; background: rgba(10, 24, 30, .45); display: none;
  align-items: center; justify-content: center; z-index: 90;
}
.mask.on { display: flex; }
.dialog {
  background: #fff; border-radius: 8px; width: 860px; max-width: 94vw; max-height: 88vh;
  overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.dialog .dh {
  padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
  display: flex; align-items: center;
}
.dialog .dh .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 16px; }
.dialog .db { padding: 14px 16px; }
.dialog .df {
  padding: 11px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px;
  justify-content: flex-end;
}

/* 登录页 */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 20% 20%, #1d4453, #0c1a21 65%);
}
.login-card {
  width: 880px; display: flex; background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
}
.login-left {
  width: 420px; padding: 42px 36px; color: #eaf4f7;
  background: linear-gradient(160deg, #17505f, #0f2a34);
  display: flex; flex-direction: column;
}
.login-left .lg { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
.login-left .sub { font-size: 12.5px; color: #9fc3cf; margin-top: 8px; line-height: 1.9; }
.login-left ul { margin: 22px 0 0; padding-left: 18px; font-size: 12px; color: #bcd6de; line-height: 2; }
.login-right { flex: 1; padding: 46px 40px; }
.login-right h2 { margin: 0 0 6px; font-size: 18px; }
.login-right .hint { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.login-right .field { margin-bottom: 14px; }
.login-right .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.login-right .field input { width: 100%; padding: 9px 11px; }
.login-right .btn.primary { width: 100%; padding: 9px; margin-top: 6px; font-size: 13.5px; }
.login-err { color: var(--up); font-size: 12px; min-height: 18px; margin-top: 8px; }
.login-demo { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.9; }

.chart-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
.chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }

/* ---------------------------------------------------------- 流程审批 */
.nav-badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 6px;
  background: var(--up, #c0392b); color: #fff; border-radius: 9px; font-size: 10.5px;
  line-height: 16px; text-align: center; font-weight: 600; }

.btn.xs { padding: 2px 8px; font-size: 11.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.apv-title { font-size: 15px; font-weight: 600; margin: 6px 0 4px; }

.apv-nodes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.apv-node { display: flex; gap: 8px; align-items: flex-start; min-width: 168px; flex: 1;
  border: 1px solid #e3eaef; border-radius: 6px; padding: 8px 10px; background: #fbfcfd; }
.apv-node.on { border-color: var(--accent2); background: #eff9fb; }
.apv-node.ok { border-color: #9ed3b4; background: #f2fbf6; }
.apv-node.no { border-color: #e6b0a8; background: #fdf4f2; }
.apv-node.skip { opacity: .55; }
.apv-dot { width: 18px; height: 18px; border-radius: 50%; background: #eef2f5; color: #6b7a88;
  font-size: 11px; line-height: 18px; text-align: center; flex: 0 0 18px; }
.apv-node.on .apv-dot { background: var(--accent2); color: #fff; }
.apv-node.ok .apv-dot { background: #1e8449; color: #fff; }
.apv-node.no .apv-dot { background: #c0392b; color: #fff; }
.apv-nb { min-width: 0; }
.apv-nm { font-size: 12.5px; font-weight: 600; }
.apv-cs { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.apv-chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #eef2f5; color: #5d6f7c; }
.apv-chip.on { background: #fbf2e0; color: #a9772a; }
.apv-chip.no { background: #fbeae7; color: #c0392b; }

.apv-tl { border-left: 2px solid #e3eaef; margin-left: 6px; padding-left: 12px; }
.apv-ti { position: relative; padding: 3px 0 7px; font-size: 12px; }
.apv-ti::before { content: ""; position: absolute; left: -18px; top: 8px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2); }
.apv-time { color: #8b9aa6; margin-right: 8px; }
.apv-act { font-weight: 600; margin-right: 6px; }
.apv-who { color: #33475b; margin-right: 6px; }
.apv-cm { color: #5d6f7c; margin: 3px 0 0 2px; line-height: 1.7; }

.apv-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; font-size: 12.5px; }
.apv-form i { display: block; font-style: normal; color: #8b9aa6; font-size: 11px; }

.apv-ncard { border: 1px dashed #d6e0e7; border-radius: 6px; padding: 6px 10px 2px; margin-bottom: 8px; background: #fbfcfd; }
.apv-ncard .form-row { margin-bottom: 4px; }

/* ---------------------------------------------------------- CRM 组件 */
.kpi-grid.four { grid-template-columns: repeat(4, 1fr); }
.kpi-grid.five { grid-template-columns: repeat(5, 1fr); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: #4a5b68; border-radius: 14px;
  padding: 3px 11px; font-size: 12px; cursor: pointer;
}
.chip b { margin-left: 6px; color: var(--muted); font-weight: 600; }
.chip.on { background: #e8f4f7; border-color: var(--accent2); color: var(--accent); }
.chip.on b { color: var(--accent); }

.empty-hint { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

/* 看板 */
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.board .col {
  flex: 1 0 200px; background: #f7fafb; border: 1px solid #e6ecf0; border-radius: 6px;
  padding: 8px; min-height: 220px;
}
.board .col-hd {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.board .col-hd span { font-weight: 400; color: var(--muted); font-size: 11px; }
.card {
  background: #fff; border: 1px solid #e3eaef; border-radius: 5px; padding: 8px 9px;
  margin-bottom: 7px; cursor: pointer; box-shadow: 0 1px 1px rgba(16, 36, 44, .03);
}
.card:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(31, 122, 140, .12); }
.card-t { font-size: 12.5px; font-weight: 600; color: #263943; line-height: 1.4; }
.card-c { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.card-m { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-size: 11.5px; }
.card-m b { font-size: 13px; color: #1f7a8c; }
.card-m span { color: var(--muted); }
.card-f { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* 漏斗 */
.funnel { display: flex; flex-direction: column; gap: 7px; }
.fn-row { display: grid; grid-template-columns: 150px 1fr 120px 60px; gap: 10px; align-items: center; }
.fn-name { font-size: 12.5px; color: #33434f; }
.fn-bar { height: 18px; background: #eef3f6; border-radius: 3px; overflow: hidden; }
.fn-bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #2b9eb3, #1f7a8c);
}
.fn-val { font-size: 12px; text-align: right; font-family: Consolas, monospace; }
.fn-conv { font-size: 11.5px; color: var(--down); text-align: right; }
.funnel-mini { display: flex; gap: 10px; flex-wrap: wrap; }
.funnel-mini .fm {
  flex: 1 0 120px; border: 1px solid #e6ecf0; border-radius: 5px; padding: 8px 10px;
  background: #fbfdfe;
}
.funnel-mini .fm-v { font-size: 15px; font-weight: 700; color: #1f7a8c; }
.funnel-mini .fm-l { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* 时间线 */
.timeline { border-left: 2px solid #e3eaef; margin: 4px 0 4px 6px; padding-left: 12px; }
.tl-item { position: relative; padding: 3px 0 8px; font-size: 12px; color: #33434f; line-height: 1.7; }
.tl-item::before {
  content: ""; position: absolute; left: -17px; top: 9px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2);
}
.tl-time { color: #8b9aa6; margin-right: 8px; font-family: Consolas, monospace; font-size: 11px; }

/* 详情头 */
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.dh-title { font-size: 16px; font-weight: 600; color: #22333d; }
.dh-tags { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.section-title {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin: 14px 0 8px;
  border-left: 3px solid var(--accent2); padding-left: 8px;
}
.note {
  background: #f6f9fb; border: 1px solid #e6ecf0; border-radius: 5px; padding: 9px 11px;
  font-size: 12.5px; color: #42555f; line-height: 1.8; margin: 8px 0;
}
.warn-box {
  background: #fdf6e9; border: 1px solid #f0dcb8; color: #8a6420; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.ok-box {
  background: #f1faf4; border: 1px solid #c9e8d5; color: #1e6b43; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.form-grid { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 8px 10px; align-items: center; }
.form-grid label { font-size: 12px; color: var(--muted); text-align: right; }
.form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
.gate { display: flex; flex-direction: column; gap: 5px; }
.gate-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0;
  border-bottom: 1px dashed #eef2f5; }

.score {
  display: inline-block; min-width: 28px; text-align: center; padding: 1px 6px;
  border-radius: 4px; font-size: 11.5px; font-weight: 700; font-family: Consolas, monospace;
}
.score.green { background: #e6f4ec; color: #1e8449; }
.score.blue { background: #e3f1f5; color: #1f7a8c; }
.score.gold { background: #fbf2e0; color: #a9772a; }
.score.red { background: #fbeae7; color: #c0392b; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
  background: #eef2f5; color: #55636f; }
.pill.s2 { background: #fbf2e0; color: #a9772a; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button {
  border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 14px;
  font-size: 12.5px; color: #55636f; cursor: pointer; border-radius: 4px 4px 0 0;
}
.tabs button.on { background: #fff; border-color: var(--line); color: var(--accent); font-weight: 600; }

.code {
  background: #0f2029; color: #d7e6ec; border-radius: 5px; padding: 9px 11px; font-size: 11.5px;
  font-family: Consolas, monospace; line-height: 1.7; overflow-x: auto; white-space: pre;
  margin: 6px 0 0;
}
code { background: #f1f5f8; padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
  font-family: Consolas, monospace; color: #1f5f6d; }
.keybox {
  font-family: Consolas, monospace; font-size: 12.5px; background: #0f2029; color: #9ee6b8;
  padding: 12px; border-radius: 5px; word-break: break-all; margin: 8px 0;
}
.intg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

<script>
/* 飞驰 MES · 离线 DEMO 数据层：拦截 fetch，在浏览器内存中实现与后端同口径的读写 */
(function () {
  "use strict";
  if (!window.__DEMO__ || !window.DB) return;

  var DB = window.DB;

  /* 会话内续期：前端部分操作会 location.reload()，离线环境用 sessionStorage 保住内存改动 */
  var STORE_KEY = "fc_demo_db";
  try {
    var saved = sessionStorage.getItem(STORE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && parsed.orders && parsed.orderD) DB = window.DB = parsed;
    }
  } catch (e) { /* 隐私模式忽略 */ }

  function persist() {
    try {
      var s = JSON.stringify(DB);
      if (s.length < 3.6e6) sessionStorage.setItem(STORE_KEY, s);
    } catch (e) { /* 超限或隐私模式忽略 */ }
  }
  var NOW = new Date();

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function r2(v) { return Math.round((Number(v || 0) + 1e-9) * 100) / 100; }
  function r4(v) { return Math.round((Number(v || 0) + 1e-9) * 10000) / 10000; }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function today() {
    return NOW.getFullYear() + "-" + pad(NOW.getMonth() + 1) + "-" + pad(NOW.getDate());
  }
  function nowStr() {
    return today() + " " + pad(NOW.getHours()) + ":" + pad(NOW.getMinutes()) + ":" + pad(NOW.getSeconds());
  }
  function minusMin(m) {
    var d = new Date(NOW.getTime() - m * 60000);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00";
  }
  function addDays(n) {
    var d = new Date(NOW.getTime() + n * 86400000);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function docNo(list, prefix) {
    var max = 0;
    list.forEach(function (x) {
      var m = String(x.no || "").match(/(\d+)$/);
      if (m) max = Math.max(max, Number(m[1]));
    });
    return prefix + today().replace(/-/g, "") + "-" + ("000" + (max + 1)).slice(-4);
  }
  function ruleVal(code, def) {
    var hit = (DB.settings.rules || []).filter(function (r) { return r.code === code; })[0];
    return hit ? Number(hit.value) : def;
  }

  /* 演示环境固定以超级管理员身份进入 */
  DB.me = { username: "admin", displayName: "系统管理员", role: "admin",
    roleLabel: "系统管理员", authType: "demo",
    perms: ["admin", "approve", "equip", "inspect", "read", "report", "stock", "write"] };
  DB.boot.user = DB.me;
  DB.__changes = DB.sync.changes || [];
  DB.__changeId = DB.__changes.reduce(function (a, c) { return Math.max(a, c.id || 0); }, 0);
  DB.__keySeq = (DB.integ.keys.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__hookSeq = (DB.integ.webhooks.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__dlvSeq = (DB.integ.deliveries.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__mapSeq = (DB.integ.mappings.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__defSeq = (DB.defects.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__andonSeq = (DB.andon.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);

  var FLOW = ["草稿", "已下达", "已开工", "已完工", "已入库", "已关闭"];
  var TARGETS = ["已下达", "已开工", "已完工", "已入库", "已关闭"];

  function idx(s) { return FLOW.indexOf(s); }

  function log(action, detail) {
    var row = { id: (DB.logs.list.length ? DB.logs.list[0].id : 0) + 1,
      username: DB.me.username, name: DB.me.displayName, action: action,
      detail: detail || "", ip: "127.0.0.1", createdAt: nowStr() };
    DB.logs.list.unshift(row);
    if (DB.logs.list.length > 300) DB.logs.list.pop();
    if (DB.logs.total !== undefined) DB.logs.total += 1;
    DB.__changeId += 1;
    DB.__changes.push({ id: DB.__changeId, objType: "", objNo: String(detail || ""),
      op: "upsert", actor: DB.me.username, payload: {}, changedAt: nowStr() });
    DB.integ.overview.changes = DB.__changes.length;
    DB.integ.overview.lastChange = nowStr();
  }

  /* ------------------------------------------------------------ 工单口径 */
  function orderListRow(o) {
    var row = DB.orders.list.filter(function (x) { return x.no === o.no; })[0];
    if (!row) return null;
    ["status", "reportedQty", "goodQty", "ngQty", "progress", "opDone", "opCount",
      "actualMin", "eff", "kitRate", "kitShort", "batchNo", "actualStart", "actualEnd",
      "dueState", "nextTargets"].forEach(function (k) { row[k] = o[k]; });
    return row;
  }

  function currentOp(o) {
    var ops = o.operations || [];
    for (var i = 0; i < ops.length; i++) {
      if (Number(ops[i].goodQty) + Number(ops[i].ngQty) < Number(ops[i].planQty) - 1e-9) {
        return ops[i].process;
      }
    }
    return ops.length ? ops[ops.length - 1].process : "—";
  }

  function kitOf(o) {
    var total = 0, ready = 0;
    (o.materials || []).forEach(function (m) {
      total += 1;
      if (Number(m.onHand) + Number(m.issued) >= Number(m.need) - 1e-9) ready += 1;
    });
    return { total: total, ready: ready, rate: total ? r4(ready / total) : 1 };
  }

  function gateOf(o) {
    var g = {}, kit = o.kit || kitOf(o), cur = idx(o.status);
    TARGETS.forEach(function (t) {
      if (idx(t) <= cur) return;
      var miss = [];
      if (t === "已下达") {
        if (!(Number(o.qty) > 0)) miss.push("计划数量必须大于 0");
        if (!o.routingCode) miss.push("工艺路线未发布");
        if (!o.bomCode) miss.push("BOM 未发布或无明细");
        if (kit.rate < 1 - 1e-9) miss.push("物料齐套率 " + Math.round(kit.rate * 100) + "%，未达 100%");
      } else if (t === "已开工") {
        if (!(o.inspections || []).some(function (x) { return x.type === "首件" && x.result === "合格"; })) {
          miss.push("首件检验未合格");
        }
        if (!o.owner) miss.push("尚未派工");
        var bad = (o.operations || []).some(function (x) {
          var e = DB.equipD[x.equipment];
          return e && (e.status === "故障" || e.status === "停机");
        });
        if (bad) miss.push("存在故障或停机设备");
      } else if (t === "已完工") {
        if (Number(o.opDone) < Number(o.opCount)) miss.push("仍有工序未完成报工");
        else if (Number(o.reportedQty) < Number(o.qty)) miss.push("报工量不足计划数量");
      } else if (t === "已入库") {
        if (idx(o.status) < idx("已完工")) miss.push("工单尚未完工");
        if (!(o.inspections || []).some(function (x) {
          return x.type === "完工检" && x.result !== "不合格";
        })) miss.push("完工检未合格");
      } else if (t === "已关闭") {
        if (idx(o.status) < idx("已入库")) miss.push("工单尚未入库");
        var open = (o.defects || []).filter(function (d) {
          return !d.disposition || d.disposition === "待处置";
        });
        if (open.length) miss.push(open.length + " 条不良未处置");
      }
      if (miss.length) g[t] = miss;
    });
    return g;
  }

  function refreshOrder(o) {
    var good = 0, ng = 0, act = 0, done = 0;
    (o.operations || []).forEach(function (x) {
      good += Number(x.goodQty || 0);
      ng += Number(x.ngQty || 0);
      act += Number(x.actualMin || 0);
      var q = Number(x.goodQty || 0) + Number(x.ngQty || 0);
      x.progress = Number(x.planQty) ? r4(q / Number(x.planQty)) : 0;
      if (q >= Number(x.planQty) - 1e-9) done += 1;
      else x.status = q > 0 ? "进行中" : "待开工";
    });
    o.goodQty = r2(good);
    o.ngQty = r2(ng);
    o.reportedQty = r2(good + ng);
    o.actualMin = r2(act);
    o.opCount = (o.operations || []).length;
    o.opDone = done;
    o.progress = Number(o.qty) ? r4((good + ng) / Number(o.qty)) : 0;
    o.eff = act > 0 ? r4(Number(o.stdMin) / act) : 0;
    o.kit = kitOf(o);
    o.kitRate = o.status === "草稿" ? null : o.kit.rate;
    o.kitShort = o.status === "草稿" ? null : (o.kit.total - o.kit.ready);
    if (["已下达", "已开工"].indexOf(o.status) >= 0 && done === o.opCount &&
        (good + ng) >= Number(o.qty) - 1e-9) {
      o.status = "已完工";
      o.actualEnd = o.actualEnd || nowStr();
    }
    var cur = TARGETS.indexOf(o.status);
    o.nextTargets = TARGETS.slice(cur + 1);
    if (o.status === "已关闭" || o.status === "已取消") o.nextTargets = [];
    o.gate = gateOf(o);
    if (!o.batch) o.batchNo = o.batchNo || "";
    orderListRow(o);
  }

  /* ------------------------------------------------------------ 派生数据 */
  function refreshKpi() {
    var k = DB.boot.kpi, wip = 0, overdue = 0;
    DB.orders.list.forEach(function (o) {
      if (o.status === "已下达" || o.status === "已开工") {
        wip += 1;
        if (o.dueState === "逾期") overdue += 1;
      }
    });
    k.wip = wip;
    k.overdue = overdue;
    k.equipAbnormal = DB.equipment.list.filter(function (e) {
      return e.status === "故障" || e.status === "停机";
    }).length;
    k.maintDue = (DB.plans.list || []).filter(function (p) {
      return p.state === "逾期" || p.state === "临期";
    }).length;
    k.abnormalDefects = DB.defects.list.filter(function (d) {
      return !d.disposition || d.disposition === "待处置";
    }).length;
    k.pendingInsp = 0;
    var a = document.getElementById("pipeLabel");
    if (a) a.textContent = "在制工单：" + k.wip;
  }

  function buildBoard() {
    var b = clone(DB.board);
    b.lines.forEach(function (ln) {
      ln.orders = DB.orders.list.filter(function (o) {
        return o.line === ln.code && (o.status === "已下达" || o.status === "已开工");
      }).map(function (o) {
        var d = DB.orderD[o.no] || o;
        return { no: o.no, materialName: o.materialName, qty: o.qty, goodQty: o.goodQty,
          status: o.status, progress: o.progress, planEnd: o.planEnd,
          currentOp: currentOp(d) };
      });
      ln.wip = ln.orders.length;
    });
    b.andon = DB.andon.list.filter(function (x) { return x.status !== "已关闭"; })
      .map(function (x) { return decorateAndon(x); });
    b.time = nowStr();
    return b;
  }

  function decorateAndon(x) {
    var c = clone(x);
    var t0 = Date.parse(String(x.createdAt || "").replace(/-/g, "/"));
    if (!x.closedAt && t0) c.minutes = Math.max(0, Math.round((NOW.getTime() - t0) / 60000));
    return c;
  }

  function trimReport(days) {
    var d = clone(DB.reports);
    d.days = days;
    function cut(a) { return (a || []).slice(Math.max(0, (a || []).length - days)); }
    if (d.production) d.production.trend = cut(d.production.trend);
    if (d.oee) d.oee.trend = cut(d.oee.trend);
    if (d.quality) d.quality.trend = cut(d.quality.trend);
    return d;
  }

  function ok(data) { return { status: 200, body: { data: data } }; }

  /* ------------------------------------------------------------ 路由 */
  var ROUTES = [];
  function on(method, re, fn) { ROUTES.push([method, re, fn]); }
  function find(list, key, v) {
    for (var i = 0; i < (list || []).length; i++) if (list[i][key] === v) return list[i];

  }

  /* 工单 */
  on("GET", /^api\/orders$/, function (m, qs) {

    }
    if (qs.overdue === "1") list = list.filter(function (o) { return o.dueState === "逾期"; });
    if (qs.kw) {
      var k = qs.kw.toLowerCase();
      list = list.filter(function (o) {
        return [o.no, o.materialCode, o.materialName, o.customer].join(" ").toLowerCase().indexOf(k) >= 0;
      });
    }
    list.sort(function (a, b) { return String(a.no) < String(b.no) ? 1 : -1; });
    return ok({ list: list, total: list.length });
  });
  on("GET", /^api\/orders\/([^/]+)$/, function (m) {
    var no = decodeURIComponent(m[1]);
    var o = DB.orderD[no];
    if (!o) return bad("工单不存在：" + no, 404);
    refreshOrder(o);
    return ok(o);
  });
  on("POST", /^api\/orders$/, function (m, qs, b) {
    var mat = DB.matD[b.materialCode] || find(DB.materials.list, "code", b.materialCode);

    var qty = Number(b.qty || 0);
    if (!(qty > 0)) return bad("计划数量必须大于 0");
    var tpl = null;
    DB.orders.list.some(function (o) {
      var d = DB.orderD[o.no];
      if (d && d.materialCode === b.materialCode) { tpl = d; return true; }

    var steps = (mat.routing && mat.routing.steps) || [];
    var ops = (tpl && tpl.operations || []).map(function (x, i) {
      return { id: 900000 + i, seq: x.seq, process: x.process, station: x.station,
        equipment: x.equipment, planQty: qty, goodQty: 0, ngQty: 0,
        stdMin: r2(Number(x.stdMin || 0) * qty / Number(tpl.qty || qty)),
        actualMin: 0, status: "待开工", operator: "", operatorName: "",
        startAt: "", endAt: "", progress: 0, reportCount: 0 };
    });
    if (!ops.length) {
      ops = steps.map(function (s, i) {
        return { id: 910000 + i, seq: s.seq, process: s.process, station: s.station,
          equipment: "", planQty: qty, goodQty: 0, ngQty: 0, stdMin: 60, actualMin: 0,
          status: "待开工", operator: "", operatorName: "", startAt: "", endAt: "",
          progress: 0, reportCount: 0 };
      });
    }
    if (!ops.length) ops = [{ id: 920000, seq: 10, process: "总装", station: "ST-3011",
      equipment: "", planQty: qty, goodQty: 0, ngQty: 0, stdMin: 60, actualMin: 0,
      status: "待开工", operator: "", operatorName: "", startAt: "", endAt: "",
      progress: 0, reportCount: 0 }];

    var mats = ((mat.bom && mat.bom.items) || []).map(function (it) {
      var mo = find(DB.materials.list, "code", it.component) || {};
      return { materialCode: it.component, name: it.name || mo.name, spec: mo.spec || "",
        need: r2(Number(it.qty) * qty * (1 + Number(it.lossRate || 0))), issued: 0,
        unit: it.unit || mo.unit, onHand: Number(mo.onHand || 0), state: "", short: 0 };
    });
    mats.forEach(function (x) {

      x.state = x.short > 0 ? "缺料" : "齐套";
    });

    var o = {
      no: no, materialCode: b.materialCode, materialName: mat.name,
      materialSpec: mat.spec, unit: mat.unit, qty: qty,
      workshop: (DB.boot.lines.filter(function (l) { return l.code === b.line; })[0] || {}).workshop || "WS-01",
      line: b.line || (DB.boot.lines[0] || {}).code, priority: b.priority || "普通",
      status: "草稿", planStart: b.planStart || today(),
      planEnd: b.planEnd || addDays(3), actualStart: "", actualEnd: "",
      routingCode: (mat.routing && mat.routing.code) || "", bomCode: (mat.bom && mat.bom.code) || "",
      salesNo: b.salesNo || "", customer: b.customer || "", planner: DB.me.username,
      plannerName: DB.me.displayName, owner: "", ownerName: "", team: "",
      remark: b.remark || "", createdAt: nowStr(),
      reportedQty: 0, goodQty: 0, ngQty: 0, progress: 0, opCount: ops.length, opDone: 0,
      stdMin: r2(ops.reduce(function (a, x) { return a + Number(x.stdMin || 0); }, 0)),
      actualMin: 0, eff: 0, dueState: "正常", nextTargets: TARGETS.slice(1),
      kitRate: null, kitShort: null, batchNo: "", batch: null,
      operations: ops, materials: mats, inspections: [], defects: [], reports: [],
      gate: {}
    };
    refreshOrder(o);
    DB.orderD[no] = o;
    DB.orders.list.unshift({
      no: no, materialCode: o.materialCode, materialName: o.materialName, qty: qty,
      workshop: o.workshop, line: o.line, priority: o.priority, status: "草稿",
      planStart: o.planStart, planEnd: o.planEnd, actualStart: "", actualEnd: "",
      routingCode: o.routingCode, bomCode: o.bomCode, customer: o.customer,
      planner: o.planner, plannerName: o.plannerName, owner: "", ownerName: "",
      team: "", remark: o.remark, createdAt: o.createdAt, reportedQty: 0, goodQty: 0,
      ngQty: 0, progress: 0, opCount: o.opCount, opDone: 0, stdMin: o.stdMin,
      actualMin: 0, eff: 0, dueState: "正常", nextTargets: o.nextTargets,
      canAdvance: [], kitRate: null, kitShort: null, batchNo: ""
    });
    DB.orders.total = (DB.orders.total || 0) + 1;
    log("新建生产工单", no + " · " + o.materialCode + " × " + qty);
    return ok({ no: no, opCount: o.opCount, status: o.status });
  });
  on("POST", /^api\/orders\/([^/]+)\/stage$/, function (m, qs, b) {
    var no = decodeURIComponent(m[1]), o = DB.orderD[no];
    if (!o) return bad("工单不存在", 404);
    var t = b.target;
    if ((o.nextTargets || []).indexOf(t) < 0) {
      return bad("不允许从「" + o.status + "」推进到「" + t + "」");
    }
    var miss = (o.gate || {})[t] || [];
    if (miss.length) return bad("闸口未通过：" + miss.join("；"));
    if (t === "已入库") return bad("请使用完工入库操作");
    o.status = t;
    if (t === "已开工") o.actualStart = o.actualStart || nowStr();
    if (t === "已完工") o.actualEnd = nowStr();
    refreshOrder(o);
    log("工单状态推进", no + " → " + t);
    return ok({ no: no, status: o.status, nextTargets: o.nextTargets });
  });
  on("POST", /^api\/orders\/([^/]+)\/cancel$/, function (m, qs, b) {
    var no = decodeURIComponent(m[1]), o = DB.orderD[no];
    if (!o) return bad("工单不存在", 404);
    if (["已入库", "已关闭", "已取消"].indexOf(o.status) >= 0) {
      return bad("工单已" + o.status + "，不能取消");
    }
    if (!b.reason) return bad("取消原因必填");
    o.status = "已取消";
    o.remark = (o.remark ? o.remark + "；" : "") + "取消：" + b.reason;
    refreshOrder(o);
    log("取消工单", no + " · " + b.reason);
    return ok({ no: no, status: o.status });
  });
  on("POST", /^api\/orders\/([^/]+)\/issue$/, function (m) {
    var no = decodeURIComponent(m[1]), o = DB.orderD[no];
    if (!o) return bad("工单不存在", 404);
    if (["已入库", "已关闭", "已取消"].indexOf(o.status) >= 0) return bad("工单已" + o.status);
    var n = 0;
    (o.materials || []).forEach(function (x) {
      if (Number(x.issued) < Number(x.need)) { x.issued = Number(x.need); n += 1; }
      x.short = Math.max(0, r2(Number(x.need) - Number(x.onHand) - Number(x.issued)));
      x.state = x.short > 0 ? "缺料" : "齐套";
    });
    refreshOrder(o);
    log("工单发料", no + " · " + n + " 项");
    return ok({ no: no, issued: n, kit: o.kit });
  });
  on("POST", /^api\/orders\/([^/]+)\/report$/, function (m, qs, b) {
    var no = decodeURIComponent(m[1]), o = DB.orderD[no];
    if (!o) return bad("工单不存在", 404);
    if (["草稿", "已下达"].indexOf(o.status) >= 0) return bad("工单尚未开工，不能报工");
    if (["已入库", "已关闭", "已取消"].indexOf(o.status) >= 0) return bad("工单已" + o.status);
    var op = (o.operations || []).filter(function (x) { return String(x.seq) === String(b.seq); })[0];
    if (!op) return bad("工序不存在");
    var good = Number(b.goodQty || 0), ng = Number(b.ngQty || 0);
    if (good < 0 || ng < 0) return bad("数量不能为负");
    if (good + ng <= 0) return bad("报工数量必须大于 0");
    if (Number(ruleVal("fai_required", 1)) >= 1 &&
        !(o.inspections || []).some(function (x) { return x.type === "首件" && x.result === "合格"; })) {
      return bad("首件检验未合格，不能报工（规则：首件必检）");
    }
    var tol = Number(ruleVal("over_report_tol", 0.05));
    var limit = Number(op.planQty) * (1 + tol);
    if (Number(op.goodQty) + Number(op.ngQty) + good + ng > limit + 1e-9) {
      return bad("超出工序计划量（含 " + Math.round(tol * 100) + "% 容差）");
    }
    op.goodQty = r2(Number(op.goodQty) + good);
    op.ngQty = r2(Number(op.ngQty) + ng);
    op.actualMin = r2(Number(op.actualMin) + Number(b.actualMin || 0));
    op.reportCount = Number(op.reportCount || 0) + 1;
    op.operator = DB.me.username;
    op.operatorName = DB.me.displayName;
    op.startAt = op.startAt || nowStr();
    op.endAt = nowStr();
    var reportNo = "RP" + today().replace(/-/g, "").slice(0, 8) + "-" + pad((o.reports || []).length + 1);
    o.reports = o.reports || [];
    o.reports.push({ no: reportNo, seq: op.seq, process: op.process, qty: good + ng,
      goodQty: good, ngQty: ng, actualMin: Number(b.actualMin || 0),
      operator: DB.me.username, shift: "白班", reportedAt: nowStr() });
    refreshOrder(o);
    log("生产报工", no + " · " + op.process + " +" + (good + ng));
    return ok({ reportNo: reportNo, eff: o.eff, woStatus: o.status,
      goodQty: o.goodQty, reportedQty: o.reportedQty, progress: o.progress });
  });
  on("POST", /^api\/orders\/([^/]+)\/stock-in$/, function (m, qs, b) {
    var no = decodeURIComponent(m[1]), o = DB.orderD[no];
    if (!o) return bad("工单不存在", 404);
    if (o.status !== "已完工") return bad("工单尚未完工，不能入库");
    if (!(o.inspections || []).some(function (x) {
      return x.type === "完工检" && x.result !== "不合格";
    })) return bad("完工检未合格，不能入库");
    var qty = Number(o.goodQty || o.qty);
    var bno = "B" + today().replace(/-/g, "") + "-" + pad(DB.batches.list.length + 1);
    var batch = { no: bno, materialCode: o.materialCode, materialName: o.materialName,
      woNo: o.no, qty: qty, goodQty: qty, workshop: o.workshop, line: o.line,
      producedAt: nowStr(), expireAt: addDays(730), status: "正常", parentBatch: "",
      remark: "工单入库批次", unit: o.unit, state: "正常", children: [], parent: [],
      order: { no: o.no, qty: o.qty, status: "已入库", customer: o.customer },
      stock: [{ warehouse: b.warehouse || "成品仓", qty: qty, updatedAt: nowStr() }],
      reports: (o.reports || []).map(function (x) {
        return { no: x.no, process: x.process, goodQty: x.goodQty,
          operator: x.operator, reportedAt: x.reportedAt };
      }) };
    DB.batches.list.unshift(batch);
    DB.batchD[bno] = batch;
    DB.trace[bno] = { root: bno, materialCode: o.materialCode, woNo: o.no,
      nodes: [{ batch: bno, materialCode: o.materialCode, materialName: o.materialName,
        qty: qty, depth: 0, producedAt: batch.producedAt, status: "正常" }],
      upstream: [], nodeCount: 1 };
    DB.stock.list.unshift({ materialCode: o.materialCode, name: o.materialName,
      unit: o.unit, warehouse: b.warehouse || "成品仓", batch: bno, qty: qty,
      amount: r2(qty * 0), updatedAt: nowStr() });
    DB.stock.total = (DB.stock.total || 0) + 1;
    var mat = DB.matD[o.materialCode];
    if (mat && mat.material) mat.material.onHand = r2(Number(mat.material.onHand) + qty);
    o.status = "已入库";
    o.batch = { no: bno, qty: qty, producedAt: batch.producedAt };
    o.batchNo = bno;
    refreshOrder(o);
    log("完工入库", no + " · 批次 " + bno);
    return ok({ batch: bno, qty: qty, status: o.status });
  });

  /* 物料与 BOM */
  on("GET", /^api\/materials$/, function (m, qs) {
    var list = DB.materials.list.slice(0);
    if (qs.type && qs.type !== "全部") list = list.filter(function (x) { return x.type === qs.type; });
    if (qs.kw) {
      var k = qs.kw.toLowerCase();

        return [x.code, x.name, x.spec].join(" ").toLowerCase().indexOf(k) >= 0;
      });
    }
    return ok({ list: list, total: list.length, summary: DB.materials.summary });
  });
  on("GET", /^api\/materials\/([^/]+)$/, function (m) {
    var code = decodeURIComponent(m[1]), d = DB.matD[code];
    if (!d) return bad("物料不存在：" + code, 404);
    return ok(d);
  });
  on("POST", /^api\/materials$/, function (m, qs, b) {
    if (!b.name) return bad("物料名称不能为空");
    var max = 0;
    DB.materials.list.forEach(function (x) {

    var code = b.code || ("MT-" + (max + 1));

      leadDays: Number(b.leadDays || 0), status: "启用", remark: b.remark || "",
      short: 0, belowSafety: false, amount: 0, updatedAt: nowStr() };

    log("新建物料", code + " · " + row.name);

  });

  /* 批次与追溯 */
  on("GET", /^api\/batches$/, function (m, qs) {
    var list = DB.batches.list.slice(0);
    if (qs.kw) {
      var k = qs.kw.toLowerCase();
      list = list.filter(function (x) {
        return [x.no, x.materialCode, x.materialName, x.woNo].join(" ").toLowerCase().indexOf(k) >= 0;
      });
    }
    return ok({ list: list, total: list.length, expiring: 0 });
  });
  on("GET", /^api\/batches\/([^/]+)$/, function (m) {
    var no = decodeURIComponent(m[1]), d = DB.batchD[no];
    if (!d) return bad("批次不存在：" + no, 404);

  });
  on("GET", /^api\/trace$/, function (m, qs) {
    var no = qs.batch || "";

    if (!t) {

  /* 质量 */
  on("GET", /^api\/quality\/summary$/, function () { return ok(DB.quality); });
  on("GET", /^api\/cpk$/, function () { return ok(DB.cpk); });
  on("GET", /^api\/defect-codes$/, function () { return ok(DB.defectCodes); });
  on("GET", /^api\/inspections$/, function (m, qs) {
    var list = DB.inspections.list.slice(0);
    if (qs.type && qs.type !== "全部") list = list.filter(function (x) { return x.type === qs.type; });
    if (qs.kw) {
      var k = qs.kw.toLowerCase();
      list = list.filter(function (x) {
        return [x.no, x.woNo, x.process].join(" ").toLowerCase().indexOf(k) >= 0;
      });
    }

  on("GET", /^api\/inspections\/([^/]+)$/, function (m) {
    var no = decodeURIComponent(m[1]), d = DB.inspD[no];
    if (!d) return bad("检验单不存在：" + no, 404);
    return ok(d);
  });
  on("POST", /^api\/inspections$/, function (m, qs, b) {
    var o = DB.orderD[b.woNo];

    var sample = Number(b.sampleQty || 0) || (b.items || []).length || 5;
    var defect = Number(b.defectQty || 0);
    if (sample <= 0) return bad("抽样数量必须大于 0");
    if (defect < 0) return bad("不良数不能为负");
    var rate = r4(defect / sample);
    var warn = Number(ruleVal("scrap_warn_rate", 0.03));
    var result = defect === 0 ? "合格" : (rate <= warn ? "让步接收" : "不合格");
    var cnt = DB.inspections.list.length + 1;
    var no = "IQ" + today().replace(/-/g, "") + "-" + pad(cnt);
    var row = { no: no, woNo: o.no, type: b.type || "巡检", seq: Number(b.seq || 0),

      result: result, standard: "GB/T 2828.1", inspector: DB.me.username,
      inspectorName: DB.me.displayName, inspectedAt: nowStr(), remark: b.remark || "" };

  };
  F.TAGS = TAGS;

  /* ---------------------------------------------------------- 请求 */
  F.raw = function (method, path, body, headers) {
    var h = { "Content-Type": "application/json" };
    var tk = localStorage.getItem(TOKEN_KEY);
    if (tk) { h.Authorization = "Bearer " + tk; h["X-Fc-Token"] = tk; }
    Object.keys(headers || {}).forEach(function (k) { h[k] = headers[k]; });
    var opt = { method: method, headers: h, credentials: "same-origin" };
    if (body !== undefined && body !== null) opt.body = JSON.stringify(body);
    return fetch(path.replace(/^\//, ""), opt).then(function (r) {
      return r.json().catch(function () { return { error: "响应解析失败" }; })
        .then(function (j) { return { status: r.status, body: j }; });
    });
  };

  F.api = function (method, path, body) {
    return F.raw(method, path, body).then(function (x) {
      if (x.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        location.href = "./login.html";
        return new Promise(function () {});
      }
      if (x.status >= 400) {
        var e = new Error((x.body && x.body.error) || ("请求失败 " + x.status));
        e.status = x.status;
        e.body = x.body;
        throw e;
      }
      return x.body.data;
    });
  };

  F.toast = function (msg, kind) {
    var el = document.getElementById("statusMsg");
    if (!el) return;
    el.textContent = msg;

    el.style.color = kind === "err" ? "#ffb3a7" : (kind === "ok" ? "#9ee6b8" : "");
    clearTimeout(F._t);
    F._t = setTimeout(function () { el.style.color = ""; }, 8000);
  };
  F.setStatus = function (t) {
    var el = document.getElementById("statusMsg");
    if (!el) return;
    if (F._toastUntil && Date.now() < F._toastUntil) return;
    el.textContent = t;
  };
  F.setSide = function (html) { var el = document.getElementById("side"); if (el) el.innerHTML = html; };

  F.can = function (perm) {
    var b = F.state.boot;
    return !!(b && b.user && (b.user.perms || []).indexOf(perm) >= 0);
  };
  F.isAdmin = function () { return F.state.boot && F.state.boot.user.role === "admin"; };
  F.me = function () { return (F.state.boot && F.state.boot.user) || {}; };

  /* ---------------------------------------------------------- 路由 */
  function parseHash() {
    var h = (location.hash || "#dashboard").replace(/^#\/?/, "");
    var i = h.indexOf("?");
    var route = i < 0 ? h : h.slice(0, i);
    var qs = i < 0 ? "" : h.slice(i + 1);
    var params = {};
    qs.split("&").forEach(function (kv) {
      if (!kv) return;
      var j = kv.indexOf("=");
      params[decodeURIComponent(j < 0 ? kv : kv.slice(0, j))] =
        decodeURIComponent(j < 0 ? "" : kv.slice(j + 1));
    });
    return { route: route || "dashboard", params: params };
  }

  F.go = function (route, params) {
    location.hash = "#" + route + (params && Object.keys(params).length ? "?" + F.qs(params) : "");
  };

  var PAGES = {};
  F.register = function (name, fn) { PAGES[name] = fn; };

  function render() {
    var r = parseHash();
    F.state.route = r.route;
    F.state.params = r.params;
    if (F.state.timer) { clearInterval(F.state.timer); F.state.timer = null; }
    var fn = PAGES[r.route] || PAGES.dashboard;
    var view = document.getElementById("view");
    view.innerHTML = "";
    paintNav(r.route);
    try {
      fn(r.params);
    } catch (e) {
      view.innerHTML = '<div class="panel"><div class="panel-body">页面渲染失败：' +
        F.esc(e.message) + "</div></div>";
    }
  }

  /* ---------------------------------------------------------- 导航 */
  var TREE = [

      ["schedule", "排产计划"], ["orders", "生产工单"]] },
    { grp: "主数据", items: [["materials", "物料与 BOM"]] },
    { grp: "质量与追溯", items: [["quality", "质量检验"], ["trace", "批次追溯"]] },
    { grp: "设备管理", items: [["equipment", "设备台账"], ["maint", "保养点检"]] },
    { grp: "库存与报表", items: [["stock", "库存台账"], ["reports", "报表分析"]] },
    { grp: "系统", items: [["integration", "集成中心"], ["settings", "基础设置"],

    materials: "物料与 BOM", quality: "质量检验", trace: "批次追溯",
    equipment: "设备台账", maint: "保养点检", stock: "库存台账", reports: "报表分析",
    integration: "集成中心", settings: "基础设置", logs: "操作日志"

    tree.innerHTML = TREE.map(function (g) {
      return '<div class="grp">' + F.esc(g.grp) + "</div>" + g.items.map(function (it) {
        var n = badgeFor[it[0]] || 0;
        var badge = n ? '<b class="nav-badge">' + n + "</b>" : "";
        return '<a href="#' + it[0] + '" class="' + (it[0] === route ? "on" : "") + '">' +
          F.esc(it[1]) + badge + "</a>";
      }).join("");
    }).join("");

    var mb = document.getElementById("menubar");
    var groupOf = {};
    MENU.forEach(function (m) { m[1].forEach(function (r) { groupOf[r] = m[0]; }); });
    mb.innerHTML = MENU.map(function (m) {
      return '<button class="' + (groupOf[route] === m[0] ? "on" : "") + '" data-group="' +
        F.esc(m[0]) + '">' + F.esc(m[0]) + "</button>";
    }).join("");
    mb.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        var g = b.getAttribute("data-group");
        var target = MENU.filter(function (m) { return m[0] === g; })[0];
        if (target) F.go(target[1][0]);

  /* ---------------------------------------------------------- 通用渲染 */
  F.table = function (headers, rows, opts) {

        (h.width ? " style='width:" + h.width + "'" : "") + ">" + F.esc(h.label) + "</th>";
    }).join("");

        headers.map(function (h) {

      F.esc(opts.empty || "暂无数据") + "</td></tr>";

  };

  F.bindRows = function (root, fn) {

      tr.addEventListener("click", function () { fn(tr.getAttribute("data-key"), tr); });

  F.dialog = function (title, body, foot) {

  F.closeDialog = function () { document.getElementById("mask").className = "mask"; };

  F.chips = function (items, active, attr) {

        '="' + F.esc(it) + '">' + F.esc(it) + "</button>";

  };

  F.lineChart = function (series, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 190, P = 34;
    var labels = opts.labels || [];
    var all = [];
    series.forEach(function (s) { all = all.concat(s.data); });
    var max = Math.max.apply(null, all.concat([1]));
    var min = opts.zero === false ? Math.min.apply(null, all) : 0;
    var span = max - min || 1;
    var colors = opts.colors || ["#1f7a8c", "#c8963e", "#7a5ea8"];
    var w = (W - P * 2) / Math.max(1, labels.length - 1);
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      var y = P + (H - P * 1.6) * t;
      var val = max - span * t;
      return '<line x1="' + P + '" y1="' + y + '" x2="' + (W - P) + '" y2="' + y +
        '" stroke="#eef2f5"/><text x="6" y="' + (y + 4) + '" font-size="10" fill="#8b9aa6">' +
        (val >= 10000 ? (val / 10000).toFixed(1) + "万" : Math.round(val)) + "</text>";
    }).join("");
    var paths = series.map(function (s, si) {
      var d = s.data.map(function (v, i) {
        var x = P + w * i;
        var y = P + (H - P * 1.6) * (1 - (v - min) / span);
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join(" ");
      return '<path d="' + d + '" fill="none" stroke="' + colors[si % colors.length] +
        '" stroke-width="2"/>' + s.data.map(function (v, i) {
          var x = P + w * i;
          var y = P + (H - P * 1.6) * (1 - (v - min) / span);
          return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' +
            colors[si % colors.length] + '"/>';
        }).join("");
    }).join("");
    var xlabels = labels.map(function (t, i) {
      return '<text x="' + (P + w * i) + '" y="' + (H - 6) +
        '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(t) + "</text>";
    }).join("");
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      grid + paths + xlabels + "</svg>";
  };

  F.barChart = function (items, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 180, P = 34;
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var gap = (W - P * 2) / Math.max(1, items.length);
    var bw = gap * 0.56;
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      items.map(function (it, i) {
        var h = (H - P * 1.8) * (it.value / max);
        var x = P + gap * i + (gap - bw) / 2;
        var y = H - P - h;
        return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
          '" height="' + Math.max(1, h).toFixed(1) + '" rx="2" fill="' + (it.color || "#2b9eb3") + '"/>' +
          '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5) +
          '" font-size="10" fill="#5d6f7c" text-anchor="middle">' + F.esc(it.label2 || "") +
          "</text>" + '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) +
          '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(it.label) + "</text>";
      }).join("") + "</svg>";
  };

        return '<div class="side-kv"><span>' + F.esc(a.text) + "</span><b>" + F.tag("高", "red") + "</b></div>";
      }).join("") : '<div class="muted small">无高优先级预警</div>') + "</div></div>" +
      '<div class="side-block"><div class="hd">业务规则</div><div class="bd small muted" style="line-height:1.9">' +
      (b.rules || []).map(function (r) {
        return (r.enabled ? "● " : "○ ") + F.esc(r.name) + "：" + r.value + F.esc(r.unit || "") +
          (r.enabled ? "" : "（停用）");
      }).join("<br>") + "</div></div>");
    F.setStatus("制造驾驶舱 · 数据截至 " + new Date().toLocaleTimeString("zh-CN"));
  });

  /* ---------------------------------------------------------- 生产看板 */
  F.register("board", function () {
    function draw(d) {
      var html = '<div class="panel"><div class="panel-title">产线实时状态' +
        '<span class="panel-actions small muted">刷新于 ' + F.esc(d.time) + "</span></div>" +
        '<div class="panel-body"><div class="board-grid">';
      (d.lines || []).forEach(function (ln) {
        html += '<div class="board-card"><div class="bc-hd"><b>' + F.esc(ln.name) + "</b>" +
          '<span class="muted small mono">' + F.esc(ln.code) + "</span>" +
          '<span class="spacer"></span>' + F.tag(ln.status) + "</div>" +
          '<div class="bc-meta small muted">设备 ' + ln.equipRun + "/" + ln.equipTotal + " 运行" +
          (ln.equipAbnormal.length ? " · 异常：" + F.esc(ln.equipAbnormal.join("、")) : "") + "</div>";
        if (!ln.orders.length) {
          html += '<div class="muted small" style="padding:8px 0">暂无在制工单</div>';
        }
        ln.orders.forEach(function (o) {
          html += '<div class="bc-order"><div class="bo-line"><span class="mono small">' +
            F.esc(o.no.slice(-8)) + '</span><span class="small">' + F.esc(o.materialName) + "</span>" +
            '<span class="spacer"></span>' + F.tag(o.status) + "</div>" +
            '<div class="bo-line small muted">当前工序：' + F.esc(o.currentOp) +
            " · 产出 " + F.qty(o.goodQty) + "/" + F.qty(o.qty) + "</div>" +
            F.progress(o.progress) + "</div>";
        });
        html += "</div>";
      });
      html += "</div></div></div>";

      html += '<div class="panel"><div class="panel-title">安灯（Andon）' +
        '<span class="panel-actions"><button class="btn sm" id="adNew">发起呼叫</button></span></div>' +
        '<div class="panel-body flush">' +
        F.table([
          { label: "编号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
          { label: "产线", key: "line" }, { label: "工位", key: "station" },
          { label: "类型", render: function (r) { return F.tag(r.type, "blue"); } },
          { label: "级别", render: function (r) { return F.tag(r.level, r.level === "紧急" ? "red" : "gold"); } },
          { label: "持续", num: true, render: function (r) { return r.minutes + " 分"; } },
          { label: "状态", render: function (r) { return F.tag(r.status); } },
          { label: "", render: function (r) {
            return r.status === "已关闭" ? "" : '<button class="btn sm" data-close-ad="' + r.id + '">关闭</button>';
          } }
        ], d.andon || [], { empty: "无呼叫" }) + "</div></div>";
      document.getElementById("view").innerHTML = html;

      document.querySelectorAll("[data-close-ad]").forEach(function (b) {
        b.addEventListener("click", function () {
          F.api("POST", "/api/andon/" + b.getAttribute("data-close-ad") + "/close",
            { remark: "班组处理完成" }).then(function () {
            F.toast("呼叫已关闭", "ok");
            load();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      var nb = document.getElementById("adNew");
      if (nb) nb.addEventListener("click", function () {
        F.dialog("发起安灯呼叫",
          '<div class="form-grid">' +
          '<label>产线<select id="adLine">' + (d.lines || []).map(function (l) {
            return '<option value="' + F.esc(l.code) + '">' + F.esc(l.name) + "</option>";
          }).join("") + "</select></label>" +
          '<label>工位<input id="adStation" placeholder="如 ST-3012"></label>' +
          '<label>类型<select id="adType"><option>设备</option><option>质量</option>' +
          "<option>物料</option><option>人员</option></select></label>" +
          '<label>级别<select id="adLevel"><option>一般</option><option>紧急</option></select></label>' +
          '<label class="full">说明<input id="adRemark" placeholder="如 拧紧机扭矩报警"></label></div>',
          '<button class="btn" id="adOk">提交</button>');
        document.getElementById("adOk").addEventListener("click", function () {
          F.api("POST", "/api/andon", {
            line: document.getElementById("adLine").value,
            station: document.getElementById("adStation").value,
            type: document.getElementById("adType").value,
            level: document.getElementById("adLevel").value,
            remark: document.getElementById("adRemark").value
          }).then(function (x) {
            F.closeDialog();
            F.toast("已发起呼叫 " + x.no, "ok");
            load();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      F.setSide('<div class="side-block"><div class="hd">看板说明</div><div class="bd small muted" ' +
        'style="line-height:1.9">按产线展示在制工单、当前工序与产出进度；设备异常与安灯呼叫实时提示。' +
        '页面每 30 秒自动刷新，也可点右上角「刷新」。</div></div>');
    }

    function load() {
      F.api("GET", "/api/board").then(function (d) {
        draw(d);
        F.setStatus("生产看板 · " + d.lines.length + " 条产线");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    var view = document.getElementById("view");
    view.innerHTML = '<div class="panel"><div class="panel-title">生产看板' +
      '<span class="panel-actions"><button class="btn sm" id="bdRefresh">刷新</button></span></div>' +
      '<div class="panel-body">加载中…</div></div>';
    document.getElementById("bdRefresh").addEventListener("click", load);
    load();
    F.state.timer = setInterval(function () {
      if (!F.dialogOpen() && F.state.route === "board") load();
    }, 30000);
  });

  /* ---------------------------------------------------------- 设置 */
  F.register("settings", function () {
    F.api("GET", "/api/settings").then(function (d) {
      var admin = F.isAdmin();
      var html = '<div class="panel"><div class="panel-title">业务规则' +
        (admin ? '<span class="panel-actions small muted">管理员可启停与调整阈值</span>' : "") +
        "</div><div class='panel-body flush'>" +
        F.table([
          { label: "规则", render: function (r) { return F.esc(r.name) + ' <span class="muted small mono">' +
            F.esc(r.code) + "</span>"; } },
          { label: "分类", render: function (r) { return F.tag(r.category, "gray"); } },
          { label: "阈值", num: true, render: function (r) {
            if (!admin) return r.value + F.esc(r.unit || "");
            return '<input type="number" step="any" data-rule-val="' + F.esc(r.code) +
              '" value="' + r.value + '" style="width:90px"> <span class="small muted">' +
              F.esc(r.unit || "") + "</span>";
          } },
          { label: "说明", render: function (r) { return '<span class="small muted">' + F.esc(r.remark) + "</span>"; } },
          { label: "状态", render: function (r) {
            if (!admin) return r.enabled ? F.tag("启用") : F.tag("停用");
            return '<label class="small"><input type="checkbox" data-rule="' + F.esc(r.code) + '"' +
              (r.enabled ? " checked" : "") + "> 启用</label>";
          } }
        ], d.rules || []) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">车间 · 产线 · 班组</div><div class="panel-body">' +
        '<div class="small muted" style="margin-bottom:8px">车间</div>' +
        F.table([{ label: "编码", key: "code" }, { label: "名称", key: "name" },
          { label: "负责人", key: "manager" },
          { label: "可用工时", num: true, render: function (r) { return F.hour(r.capacityMin); } },
          { label: "状态", render: function (r) { return F.tag(r.status); } }], d.workshops || []) +
        '<div class="small muted" style="margin:12px 0 8px">产线</div>' +
        F.table([{ label: "编码", key: "code" }, { label: "名称", key: "name" },
          { label: "车间", key: "workshop" }, { label: "线长", key: "leader" },
          { label: "节拍", num: true, render: function (r) { return r.taktSec + " 秒"; } },
          { label: "状态", render: function (r) { return F.tag(r.status); } }], d.lines || []) +
        '<div class="small muted" style="margin:12px 0 8px">班组</div>' +
        F.table([{ label: "编码", key: "code" }, { label: "名称", key: "name" },
          { label: "车间", key: "workshop" }, { label: "班组长", key: "leader" },
          { label: "班次", render: function (r) { return F.tag(r.shift, "blue"); } },
          { label: "成员", render: function (r) { return '<span class="small muted">' + F.esc(r.members) + "</span>"; } }],
          d.teams || []) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">用户与角色</div><div class="panel-body flush">' +
        F.table([{ label: "账号", key: "username" }, { label: "姓名", key: "name" },
          { label: "角色", render: function (r) { return F.tag(r.roleLabel, "blue"); } },
          { label: "部门", key: "dept" }, { label: "状态", render: function (r) { return F.tag(r.status); } }],
          d.users || []) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">角色权限矩阵</div><div class="panel-body flush">' +
        F.table([{ label: "角色", render: function (r) { return F.esc(r.label) +
            ' <span class="muted small mono">' + F.esc(r.role) + "</span>"; } },
          { label: "权限位", render: function (r) {
            return r.perms.map(function (p) { return F.tag(p, "gray"); }).join(" ");
          } }], d.roles || []) + "</div></div>";

      document.getElementById("view").innerHTML = html;
      document.querySelectorAll("[data-rule]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var code = cb.getAttribute("data-rule");
          F.api("PUT", "/api/rules/" + encodeURIComponent(code), { enabled: cb.checked })
            .then(function () { F.toast("规则已" + (cb.checked ? "启用" : "停用") + "：" + code, "ok"); })
            .catch(function (e) { cb.checked = !cb.checked; F.toast(e.message, "err"); });
        });
      });
      document.querySelectorAll("[data-rule-val]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var code = inp.getAttribute("data-rule-val");
          F.api("PUT", "/api/rules/" + encodeURIComponent(code), { value: Number(inp.value) })
            .then(function (x) { F.toast("阈值已更新：" + code + " = " + x.value, "ok"); F.reload(); })
            .catch(function (e) { F.toast(e.message, "err"); });
        });
      });
      F.setStatus("基础设置 · " + (d.rules || []).length + " 条业务规则");
      F.setSide('<div class="side-block"><div class="hd">当前登录</div><div class="bd">' +
        F.kv("账号", F.esc(F.me().username || "")) +
        F.kv("姓名", F.esc(F.me().displayName || "")) +
        F.kv("角色", F.esc(F.me().roleLabel || "")) +
        "</div></div>" +
        '<div class="side-block"><div class="hd">口径提示</div><div class="bd small muted" ' +
        'style="line-height:1.9">规则调整立即生效并写入操作日志：OEE 目标影响看板判定，' +
        "首件必检影响报工准入，缺料禁止下达影响工单下达闸口，超产容差影响报工上限。</div></div>");
    }).catch(function (e) { F.toast(e.message, "err"); });
  });

  /* ---------------------------------------------------------- 日志 */
  F.register("logs", function () {
    F.api("GET", "/api/logs?limit=200").then(function (d) {
      document.getElementById("view").innerHTML =
        '<div class="panel"><div class="panel-title">操作日志' +
        '<span class="panel-actions small muted">最近 ' + d.total + " 条</span></div>" +
        '<div class="panel-body flush">' +
        F.table([
          { label: "时间", render: function (r) { return '<span class="small muted">' + F.esc(r.createdAt) + "</span>"; } },
          { label: "操作员", key: "username" },
          { label: "动作", render: function (r) { return F.tag(r.action, "blue"); } },
          { label: "详情", render: function (r) { return '<span class="small">' + F.esc(r.detail || "—") + "</span>"; } }
        ], d.list, { empty: "暂无日志" }) + "</div></div>";
      F.setStatus("操作日志 · " + d.total + " 条");
    }).catch(function (e) { F.toast(e.message, "err"); });
  });

  /* ---------------------------------------------------------- 启动 */
  function boot() {
    if (!localStorage.getItem(TOKEN_KEY)) {
      location.href = "./login.html";
      return;
    }
    var lg = document.getElementById("btnLogout");
    if (lg) {
      lg.addEventListener("click", function () {
        F.api("POST", "/api/auth/logout", {}).catch(function () {}).then(function () {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem("fc_user");
          location.href = "./login.html";
        });
      });
    }
    var foot = document.getElementById("opFoot");
    if (foot) {
      foot.textContent = "操作员：" + (localStorage.getItem("fc_name") || "") +
        "（" + (localStorage.getItem("fc_role_label") || "") + "）";
    }
    F.reload().then(function () {
      window.addEventListener("hashchange", render);
      if (!location.hash) location.hash = "dashboard";
      render();
      F.setStatus("系统就绪 · 演示数据为确定性生成");
    }).catch(function (e) {
      F.toast("初始化失败：" + e.message, "err");
    });
  }

  F.reload = function () {
    return F.api("GET", "/api/bootstrap").then(function (d) {
      F.state.boot = d;
      var a = document.getElementById("pipeLabel");
      if (a) a.textContent = "在制工单：" + d.kpi.wip;
      var r = document.getElementById("wonLabel");
      if (r) r.textContent = "今日产出：" + F.qty(d.kpi.todayOutput);
      localStorage.setItem("fc_role", d.user.role);
      localStorage.setItem("fc_name", d.user.displayName);
      localStorage.setItem("fc_role_label", d.user.roleLabel);
      localStorage.setItem("fc_user", d.user.username);
      return d;
    });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(window, document);

</script>
<script>
/* 飞驰 MES · 排产计划与生产工单（工单状态机 / 报工 / 入库） */
(function (window, document) {
  "use strict";
  var F = window.F;
  var STATUS = ["全部", "草稿", "已下达", "已开工", "已完工", "已入库", "已关闭", "已取消"];

  function daysBetween(a, b) {
    if (!a || !b) return 0;
    return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  }
  function addDays(d, n) {
    var x = new Date(d + "T00:00:00");
    x.setDate(x.getDate() + n);
    return x.toISOString().slice(0, 10);
  }

  /* ---------------------------------------------------------- 排产计划 */
  F.register("schedule", function () {
    F.api("GET", "/api/orders?status=全部").then(function (d) {
      var today = F.today();
      var start = addDays(today, -3);
      var days = 17;
      var list = (d.list || []).filter(function (w) {
        return w.status !== "已取消" && w.status !== "已关闭" && w.planEnd >= start &&
          w.planStart <= addDays(start, days - 1);
      });
      var head = '<tr><th style="width:120px">产线</th>';
      for (var i = 0; i < days; i++) {
        var day = addDays(start, i);
        head += '<th class="num" style="width:' + (100 / days).toFixed(2) + '%">' +
          (i % 2 === 0 ? day.slice(5) : "&nbsp;") + "</th>";
      }
      head += "</tr>";
      var rowsHtml = "";
      var lines = (F.state.boot.lines || []);
      lines.forEach(function (ln) {
        rowsHtml += '<tr><td><b>' + F.esc(ln.name) + '</b><div class="muted small mono">' +
          F.esc(ln.code) + "</div></td>";
        var cells = [];
        for (var i = 0; i < days; i++) cells.push([]);
        list.filter(function (w) { return w.line === ln.code; }).forEach(function (w) {
          var s = Math.max(0, daysBetween(start, w.planStart));
          var e = Math.min(days - 1, daysBetween(start, w.planEnd));
          if (e < 0 || s > days - 1) return;
          if (e < s) e = s;
          cells[s].push({ w: w, span: e - s + 1 });
        });
        for (var i2 = 0; i2 < days; i2++) {
          var items = cells[i2];
          if (!items.length) {
            rowsHtml += '<td class="' + (addDays(start, i2) === today ? "today" : "") + '"></td>';
            continue;
          }
          var cell = "";
          items.forEach(function (it) {
            var cls = it.w.status === "已开工" ? "g-run" : (it.w.status === "已下达" ? "g-plan" :
              (it.w.status === "已完工" ? "g-done" : "g-draft"));
            cell += '<div class="gantt-bar ' + cls + '" title="' + F.esc(it.w.no + " " +
              it.w.materialName + " ×" + it.w.qty + " · " + it.w.status) +
              '" data-wo="' + F.esc(it.w.no) + '">' + F.esc(it.w.materialName.slice(0, 6)) +
              " " + F.qty(it.w.qty) + "</div>";
          });
          rowsHtml += '<td class="' + (addDays(start, i2) === today ? "today" : "") + '">' + cell + "</td>";
        }
        rowsHtml += "</tr>";
      });

      var html = '<div class="panel"><div class="panel-title">排产甘特（未来两周）' +
        '<span class="panel-actions small muted">共 ' + list.length + " 个未结工单</span></div>" +
        '<div class="panel-body"><div style="overflow-x:auto"><table class="gantt-table">' +
        head + rowsHtml + "</table></div>" +
        '<div class="small muted" style="margin-top:8px">' +
        '<span class="dot" style="background:#8fb3c4"></span>草稿 ' +
        '<span class="dot" style="background:#2b7fa8"></span>已下达 ' +
        '<span class="dot" style="background:#c8963e"></span>已开工 ' +
        '<span class="dot" style="background:#2f8f5b"></span>已完工　（点击色块打开工单）</div></div></div>';

      var byLine = {};
      list.forEach(function (w) {
        byLine[w.line] = byLine[w.line] || { qty: 0, std: 0, count: 0 };
        byLine[w.line].qty += Number(w.qty || 0);
        byLine[w.line].std += Number(w.stdMin || 0);
        byLine[w.line].count += 1;
      });
      html += '<div class="panel"><div class="panel-title">产能负荷' +
        '<span class="panel-actions small muted">按标准工时 / 可用工时</span></div>' +
        '<div class="panel-body">' +
        F.barChart(lines.map(function (l) {
          var v = byLine[l.code] || { std: 0 };
          return { label: l.code.replace("LN-", ""), value: v.std, label2: F.hour(v.std) };
        }), { height: 170 }) + "</div></div>";

      html += '<div class="panel"><div class="panel-title">待下达工单' +
        '<span class="panel-actions"><button class="btn sm" id="scNew">新建工单</button></span></div>' +
        '<div class="panel-body flush">' +
        F.table([
          { label: "工单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
          { label: "物料", render: function (r) { return F.esc(r.materialName) +
            '<div class="muted small mono">' + F.esc(r.materialCode) + "</div>"; } },
          { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
          { label: "齐套", render: function (r) {
            if (r.kitRate === null || r.kitRate === undefined) return "—";
            return F.progress(r.kitRate, r.kitRate < 1 ? "warn" : "") + '<span class="small">' +
              F.pct(r.kitRate, 0) + "</span>";
          } },
          { label: "计划完成", key: "planEnd" },
          { label: "状态", render: function (r) { return F.tag(r.status); } }
        ], list.filter(function (w) { return w.status === "草稿" || w.status === "已下达"; }),
          { empty: "没有待下达工单", click: function (r) { return r.no; } }) + "</div></div>";

      document.getElementById("view").innerHTML = html;
      F.bindRows(document, function (no) { openOrder(no); });
      document.querySelectorAll("[data-wo]").forEach(function (b) {
        b.addEventListener("click", function () { openOrder(b.getAttribute("data-wo")); });
      });
      var nb = document.getElementById("scNew");
      if (nb) nb.addEventListener("click", newOrder);
      F.setStatus("排产计划 · " + list.length + " 个工单分布在未来两周");
    }).catch(function (e) { F.toast(e.message, "err"); });
  });

  /* ---------------------------------------------------------- 工单列表 */
  var st = { status: "全部", kw: "", overdue: false };

  F.register("orders", function () {
    var view = document.getElementById("view");
    view.innerHTML = '<div class="panel"><div class="panel-title">生产工单' +
      '<span class="panel-actions">' +
      '<input id="oKw" placeholder="工单号 / 物料 / 客户" style="width:190px;margin-right:6px">' +
      '<button class="btn sm" id="oSearch">查询</button> ' +
      '<button class="btn sm" id="oNew">新建工单</button></span></div>' +
      '<div class="panel-body"><div id="oChips"></div><div id="oList">加载中…</div></div></div>';

    function load() {
      F.api("GET", "/api/orders?" + F.qs({ status: st.status, kw: st.kw,
        overdue: st.overdue ? 1 : "" })).then(function (d) {
        document.getElementById("oChips").innerHTML =
          F.chips(STATUS, st.status) +
          '<label class="small" style="margin-left:10px"><input type="checkbox" id="oOd"' +
          (st.overdue ? " checked" : "") + "> 只看逾期</label>" +
          '<span class="small muted" style="margin-left:10px">共 ' + d.total + " 单</span>";
        document.getElementById("oList").innerHTML = F.table([
          { label: "工单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
          { label: "物料", render: function (r) { return F.esc(r.materialName) +
            '<div class="muted small mono">' + F.esc(r.materialCode) + "</div>"; } },
          { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
          { label: "报工 / 合格", num: true, render: function (r) {
            return F.qty(r.reportedQty) + " / " + F.qty(r.goodQty); } },
          { label: "进度", render: function (r) {
            return '<div class="tl">' + F.progress(r.progress, r.progress >= 1 ? "" : "warn") +
              '<span class="small">' + F.pct(Math.min(1, r.progress), 0) + "</span></div>"; } },
          { label: "工序", num: true, render: function (r) { return r.opDone + "/" + r.opCount; } },
          { label: "产线", key: "line" },
          { label: "计划完成", render: function (r) { return F.esc(r.planEnd) +
            (r.dueState === "逾期" ? " " + F.tag("逾期", "red") : ""); } },
          { label: "状态", render: function (r) { return F.tag(r.status); } },
          { label: "优先级", render: function (r) { return F.prio(r.priority); } }
        ], d.list, { empty: "没有符合条件的工单", click: function (r) { return r.no; } });
        F.bindRows(document, function (no) { openOrder(no); });
        document.querySelectorAll("#oChips .chip").forEach(function (c) {
          c.addEventListener("click", function () {
            st.status = c.getAttribute("data-st");
            load();
          });
        });
        document.getElementById("oOd").addEventListener("change", function (e) {
          st.overdue = e.target.checked;
          load();
        });
        F.setStatus("生产工单 · " + d.total + " 单（" + st.status + "）");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    document.getElementById("oSearch").addEventListener("click", function () {
      st.kw = document.getElementById("oKw").value.trim();
      load();
    });
    document.getElementById("oKw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { st.kw = e.target.value.trim(); load(); }
    });
    document.getElementById("oNew").addEventListener("click", newOrder);
    load();
  });

  /* ---------------------------------------------------------- 新建工单 */
  function newOrder() {
    F.api("GET", "/api/materials?type=成品").then(function (m) {
      var mats = (m.list || []).concat([]);
      F.api("GET", "/api/materials?type=半成品").then(function (h) {
        mats = mats.concat(h.list || []);
        var lines = F.state.boot.lines || [];
        F.dialog("新建生产工单",
          '<div class="form-grid">' +
          '<label>产出物料</label><select id="noMat">' + mats.map(function (x) {
            return '<option value="' + F.esc(x.code) + '">' + F.esc(x.code + " " + x.name) + "</option>";
          }).join("") + "</select>" +
          '<label>计划数量</label><input id="noQty" type="number" value="100" min="1">' +
          '<label>产线</label><select id="noLine">' + lines.map(function (l) {
            return '<option value="' + F.esc(l.code) + '">' + F.esc(l.name) + "</option>";
          }).join("") + "</select>" +
          '<label>优先级</label><select id="noPrio"><option>普通</option><option>紧急</option></select>' +
          '<label>计划开始</label><input id="noStart" type="date" value="' + F.today() + '">' +
          '<label>客户 / 来源</label><input id="noCust" placeholder="如 苏州智联科技">' +
          '<label>备注</label><input id="noRemark" placeholder="选填"></div>' +
          '<div class="small muted" style="margin-top:8px">新建后为「草稿」，需齐套率 100% 且工艺路线、BOM 已发布才能下达。</div>',
          '<button class="btn" id="noOk">创建</button>');
        document.getElementById("noOk").addEventListener("click", function () {
          F.api("POST", "/api/orders", {
